<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2EDFF">
<meta name="description" content="Chopper English: game học tiếng Anh vui cùng chú corgi Chopper.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chopper English">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%;height:100%}body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}input{-webkit-user-select:text;user-select:text}</style>
<title>Chopper English</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#F2EDFF;--paper:#FFFFFF;--ink:#37285A;--ink-soft:#6B5E8E;--line:#E0D6FA;
  --pink:#FF86AE;--pink-soft:#FFE3EC;--pink-btn:#E5568C;--pink-btn-s:#B63A6C;
  --mint:#6FD3B5;--mint-soft:#DDF7EE;--mint-deep:#1E8E6E;--mint-btn:#25A07E;--mint-btn-s:#167A5D;
  --sun:#FFC94D;--sun-soft:#FFF3CC;--sky:#8DC6FF;--sky-soft:#E3F1FF;
  --coral:#FF8B7B;--coral-soft:#FFE4DF;--coral-deep:#C9402D;--coral-btn:#E85D4A;--coral-btn-s:#B8402F;
  --display:'Baloo 2','Nunito',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,#DDD2FA 1.6px,transparent 0);background-size:24px 24px;color:var(--ink);font:700 16px/1.45 var(--body);padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
button:disabled{cursor:default}
h1,h2,h3,p{margin:0}
#app{max-width:480px;margin:0 auto;position:relative}
#app.has-sheet{padding-bottom:210px}
.row{display:flex;align-items:center;gap:8px}

/* buttons */
.btn{display:block;width:100%;border-radius:18px;padding:12px 18px;font:800 20px/1.1 var(--display);color:#fff;text-align:center;background:var(--bc,var(--pink-btn));box-shadow:0 5px 0 var(--bs,var(--pink-btn-s));transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--bs,var(--pink-btn-s))}
.btn.pink{--bc:var(--pink-btn);--bs:var(--pink-btn-s)}
.btn.green{--bc:var(--mint-btn);--bs:var(--mint-btn-s)}
.btn.coral{--bc:var(--coral-btn);--bs:var(--coral-btn-s)}
.btn.plain{--bc:#fff;--bs:var(--line);color:var(--ink);border:3px solid var(--line)}
.btn.small{width:auto;padding:8px 16px;font-size:17px}
.btn:disabled{--bc:#D9D0EE;--bs:#BDB1DC}
.link{color:var(--ink-soft);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.round,.xbtn{width:40px;height:40px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--ink-soft);flex:none}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:3px 12px;font:700 18px/1.3 var(--display);flex:none}
.pill.sm{font-size:16px;padding:2px 10px}

/* home */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.logo{font:800 26px/1 var(--display);color:var(--pink-btn)}
.logo span{color:var(--ink);margin-left:6px}
.hero{display:flex;align-items:flex-end;gap:6px;margin:6px 0 10px}
.mochibtn{width:140px;flex:none}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:10px 14px;margin-bottom:34px}
.bubble::before{content:"";position:absolute;left:-10px;bottom:20px;width:15px;height:15px;background:var(--paper);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}
.bubble .en{font:800 21px/1.15 var(--display)}
.bubble .vi{font-size:14px;color:var(--ink-soft);font-weight:700}
.sec{font:800 20px/1.2 var(--display);margin:6px 0 10px}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcard{background:var(--paper);border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:transform .08s,box-shadow .08s}
.tcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.ticon{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:var(--tint);margin-bottom:4px}
.tname{font:800 22px/1 var(--display)}
.tvi{color:var(--ink-soft);font-size:14px}
.tbest{font:800 14px var(--display);color:#B27700}
.tbest.none{color:var(--ink-soft);font-weight:700}
.reward{margin-top:18px;background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rt{font:800 18px/1.2 var(--display)}
.rs{font-size:14px;color:var(--ink-soft)}
.bar{flex:1;height:16px;background:#E5DCFB;border-radius:999px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--pink);border-radius:999px;transition:width .4s ease}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.5)}
.bar.sun>i{background:var(--sun)}

/* mochi */
.mochi{display:block;width:100%;height:auto;overflow:visible}
.mochi .e-idle,.mochi .e-happy,.mochi .e-sad{display:none}
.mood-idle .e-idle,.mood-happy .e-happy,.mood-sad .e-sad{display:inline}
.mochi .whole{transform-origin:100px 196px}
.mood-idle .whole{animation:breathe 3.2s ease-in-out infinite}
.mood-happy .whole{animation:hop .7s ease 1}
.mood-sad .whole{animation:wobble .6s ease 1}
.mochi .tail{transform-origin:148px 170px;animation:wag 1.8s ease-in-out infinite}
.mood-sad .tail{animation:none}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px)}60%{transform:translateY(0)}78%{transform:translateY(-6px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.coach{display:flex;align-items:center;gap:6px;margin:4px 0 12px}
.coach>div:first-child{width:84px;flex:none}
.coach .bubble{margin-bottom:0;padding:8px 12px}
.coach .bubble::before{bottom:auto;top:50%;margin-top:-8px}
.stage{background:var(--paper);border:3px solid var(--line);border-radius:28px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 6px 0 var(--line)}
.speaker{width:88px;height:88px;border-radius:50%;background:var(--pink-btn);box-shadow:0 6px 0 var(--pink-btn-s);display:grid;place-items:center;flex:none;transition:transform .08s,box-shadow .08s}
.speaker:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-btn-s)}
.speaker.sm{width:52px;height:52px;box-shadow:0 4px 0 var(--pink-btn-s)}
.speaker.sm svg{width:28px;height:28px}
.peek{font:800 28px/1 var(--display);color:var(--pink-btn)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.stack{display:flex;flex-direction:column;gap:10px;width:100%}
.opt{background:var(--paper);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);border-radius:20px;min-height:68px;display:grid;place-items:center;padding:8px;font:800 23px/1.1 var(--display);transition:transform .08s,box-shadow .08s}
.opt.emo{font-size:50px;min-height:92px}
.stack .opt{min-height:56px;font-size:22px}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.ok{background:var(--mint-soft);border-color:var(--mint);box-shadow:0 5px 0 var(--mint);animation:pop .35s}
.opt.bad{background:var(--coral-soft);border-color:var(--coral);box-shadow:0 5px 0 var(--coral);animation:shake .35s}
.opt.dim{opacity:.45}
.bigemo{font-size:84px;line-height:1;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:var(--tint)}
.sentence{display:flex;align-items:center;gap:12px;width:100%}
.semo{font-size:48px;line-height:1;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:var(--tint);flex:none}
.stext{font:700 22px/1.4 var(--display);min-width:0}
.blank{display:inline-block;min-width:84px;border-bottom:4px dashed var(--pink);text-align:center;color:transparent;vertical-align:bottom}
.blank.on{color:var(--mint-deep);border-bottom:4px solid var(--mint)}
.meaning{font:800 20px/1 var(--body);color:var(--ink-soft)}
.srows{display:flex;flex-direction:column;align-items:center;gap:8px}
.srow{display:flex;gap:6px;justify-content:center}
.slot{width:clamp(28px,calc((min(100vw,480px) - 84px - 42px)/8),42px);height:48px;border-radius:12px;border:3px dashed var(--line);background:#FAF7FF;font:800 24px var(--display);display:grid;place-items:center;padding:0}
.slot.f{border-style:solid;border-color:var(--pink);background:var(--pink-soft)}
.slot.ok{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-deep)}
.slot.bad{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-deep)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.tile{width:42px;height:48px;border-radius:14px;background:var(--sky-soft);border:3px solid var(--sky);box-shadow:0 4px 0 var(--sky);font:800 25px var(--display);transition:transform .08s,box-shadow .08s}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--sky)}
.tile.used{opacity:.2;box-shadow:none}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);border-top:3px solid var(--line);background:var(--paper)}
.sheet.show{transform:none}
.sheet.ok{background:var(--mint-soft);border-color:var(--mint)}
.sheet.bad{background:var(--coral-soft);border-color:var(--coral)}
.sheet-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet .st{font:800 26px/1.1 var(--display)}
.sheet.ok .st{color:var(--mint-deep)}
.sheet.bad .st{color:var(--coral-deep)}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.rmochi{width:190px}
.rtitle{font:800 30px/1.1 var(--display)}
.rsub{color:var(--ink-soft)}
.starrow{display:flex;gap:2px;font-size:30px;line-height:1;color:#D6CBEF}
.starrow .on{color:var(--sun)}
.rscore{font:800 18px var(--display)}
.unlock{width:100%;background:var(--sun-soft);border:3px solid var(--sun);border-radius:22px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left}
.unlock .ue{font-size:42px;line-height:1}
.unlock b{font:800 18px/1.2 var(--display);display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:flex;gap:6px;align-items:center;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font:700 16px var(--display)}
.chip.miss{border-color:var(--coral)}
.rbtns{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:8px}

/* wardrobe */
.wtitle{font:800 22px/1 var(--display);flex:1}
.wstage{width:210px;margin:6px auto 14px}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wcard{background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 14px/1.2 var(--display);text-align:center}
.wcard .we{font-size:34px;line-height:1.1}
.wcard.eq{border-color:var(--pink);background:var(--pink-soft)}
.wcard.lock{opacity:.6}
.wcard small{font:700 12px var(--body);color:var(--ink-soft)}

/* modal + confetti */
.modal{position:fixed;inset:0;background:rgba(55,40,90,.45);display:grid;place-items:center;z-index:40;padding:16px}
.mbox{background:#fff;border-radius:26px;padding:20px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.mbox .mm{width:96px;margin:0 auto}
.mbox .mt{font:800 24px/1.1 var(--display)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
/* family / levels / players */
.splash{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:80px;text-align:center}
.splash .mochi{width:150px}
.who{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:3px 14px 3px 4px;font:800 18px/1.3 var(--display);max-width:100%}
.avc{width:34px;height:34px;border-radius:50%;background:var(--pink-soft);display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:2px}
.tag{background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:3px 12px;font:700 15px/1.3 var(--display)}
.tag.fire{border-color:#FFD2A8;background:#FFF1E3}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:8px 4px;font:800 18px/1.15 var(--display);display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 var(--line)}
.seg button small{font:700 12px var(--body);color:var(--ink-soft)}
.seg button.on{border-color:var(--pink);background:var(--pink-soft);box-shadow:0 4px 0 var(--pink)}
.lvhint{font-size:13px;color:var(--ink-soft);margin:8px 2px 12px;text-align:center}
.duo{display:flex;align-items:center;gap:10px;background:var(--sky-soft);border:3px solid var(--sky);border-radius:20px;padding:8px 12px;margin-bottom:12px;font:800 16px/1.2 var(--display)}
.duo span{flex:1;min-width:0}
.mini{border:2px solid var(--line);border-radius:12px;padding:4px 10px;font:800 14px var(--display);background:#fff;flex:none}
.reward{margin-top:14px;background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px}
.syncnote{margin-top:16px;text-align:center;font-size:13px;color:var(--ink-soft)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{background:var(--paper);border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pcard .avc{width:60px;height:60px;font-size:34px}
.pcard .pn{font:800 20px/1.1 var(--display);overflow-wrap:anywhere;text-align:center}
.pcard .ps{font:700 14px var(--body);color:var(--ink-soft)}
.pcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.inp{width:100%;font:700 18px var(--body);padding:10px 14px;border:3px solid var(--line);border-radius:16px;color:var(--ink);background:#fff}
.inp:focus{outline:none;border-color:var(--pink)}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.av{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:24px;line-height:1}
.av.on{border-color:var(--pink);background:var(--pink-soft)}
.lb{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:6px 12px}
.lrow .rk{width:22px;font:800 18px var(--display);color:var(--ink-soft);flex:none}
.lrow .nm{flex:1;min-width:0;font:800 18px/1.2 var(--display);overflow-wrap:anywhere}
.lrow small{display:block;font:700 12px var(--body);color:var(--ink-soft)}
.lrow .sc{font:800 18px var(--display);flex:none}
.rw{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px 12px}
.rw.ready{border-color:var(--sun);background:var(--sun-soft)}
.rw.done{opacity:.6}
.rw .re{font-size:28px;line-height:1;flex:none}
.rw .rb{flex:1;min-width:0}
.rw b{font:800 17px/1.2 var(--display);display:block;overflow-wrap:anywhere}
.rw small{font-size:13px;color:var(--ink-soft)}
.timer{height:10px;background:#E5DCFB;border-radius:999px;overflow:hidden;margin:0 0 8px}
.timer i{display:block;height:100%;width:100%;background:var(--sky);transition:width .1s linear}
.timer i.low{background:var(--coral)}
.bigvi{font:800 30px/1.1 var(--display);text-align:center;padding:10px 6px;min-width:0;overflow-wrap:anywhere}
.rcard{width:100%;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left}
.rcard .rcb{min-width:0}
.rcard b{font:800 18px/1.2 var(--display);display:block}
.rcard small{font-size:13px;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font:700 15px var(--body);z-index:50;max-width:calc(100vw - 32px);text-align:center}
.mbox .inp{text-align:center}
.tcard.wide{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center;background:var(--sun-soft);border-color:var(--sun);box-shadow:0 5px 0 var(--sun)}
.tcard.wide .ticon{grid-row:1/4;margin:0}
.tip{display:flex;gap:8px;align-items:center;background:var(--sky-soft);border:3px solid var(--sky);border-radius:20px;padding:8px 12px;margin-bottom:10px}
.tipb{flex:1;min-width:0}
.tipb b{display:block;font:800 16px/1.2 var(--display)}
.tipb small{font-size:13px;color:var(--ink-soft);font-weight:700}
.tfword{font:800 34px/1 var(--display);padding:8px 20px;border-radius:18px;background:var(--sun-soft);border:3px solid var(--sun)}
.ostrip{min-height:62px;width:100%;border:3px dashed var(--line);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#FAF7FF}
.ostrip .ph{color:var(--ink-soft);font-size:14px;text-align:center}
.ostrip.ok{border:3px solid var(--mint);background:var(--mint-soft)}
.ostrip.bad{border:3px solid var(--coral);background:var(--coral-soft)}
.oc{border-radius:14px;background:var(--pink-soft);border:3px solid var(--pink);padding:4px 10px;font:800 19px var(--display)}
.otile{border-radius:14px;background:var(--sky-soft);border:3px solid var(--sky);box-shadow:0 4px 0 var(--sky);padding:6px 12px;font:800 19px var(--display);transition:transform .08s,box-shadow .08s}
.otile:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--sky)}
.otile.used{opacity:.2;box-shadow:none}
.fixs{font:800 19px/1.35 var(--display);text-align:center;color:var(--pink-btn-s)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* chopper 3D + nhà vườn + trò chơi nhanh */

/* ---------- sound ---------- */
var actx=null;
function tone(f,d,when,type,vol){
  if(!save.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    var t=actx.currentTime+(when||0),o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.05);
  }catch(e){}
}
var sfx={
  ok:function(){tone(660,.14);tone(880,.22,.12)},
  bad:function(){tone(300,.22,0,'triangle');tone(240,.3,.18,'triangle')},
  tap:function(){tone(520,.06,0,'sine',.1)},
  win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.24,i*.12)})}
};

/* ---------- background music (original music-box loop, WebAudio) ---------- */
function ac(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}catch(e){return null}
}
var NOTE={C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880,C6:1046.5};
var MELBARS=[
 'E5 . G5 . A5 . G5 .','E5 . D5 . C5 . . .','C5 . D5 . E5 . G5 .','A5 . G5 . D5 . . .',
 'G5 . A5 . C6 . A5 .','G5 . E5 . D5 . C5 .','D5 . E5 . G5 . E5 .','D5 . C5 . D5 . . .'
].map(function(b){return b.split(' ')});
var BARCH=[0,1,2,3,0,1,2,3];
var ARP=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]];
var BASSF=[130.81,110,87.31,98];
var MU={on:false,armed:false,g:null,timer:null,t:0,s:0,vol:.6};
function mNote(f,t,dur,vol,type){
  var c=actx,o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(MU.g);o.start(t);o.stop(t+dur+.05);
}
function musicTick(){
  if(!MU.on||!actx)return;
  while(MU.t<actx.currentTime+.5){
    var st=MU.s%64,bar=Math.floor(st/8),sl=st%8,t=MU.t,ch=BARCH[bar],m=MELBARS[bar][sl];
    if(m&&m!=='.'){var f=NOTE[m];mNote(f,t,1.1,.07);mNote(f*2,t,.5,.016,'triangle')}
    mNote(ARP[ch][[0,1,2,1,0,1,2,1][sl]],t,.7,.028);
    if(sl===0)mNote(BASSF[ch],t,1.5,.06);
    if(sl===4)mNote(BASSF[ch]*2,t,.9,.03);
    MU.t+=.32;MU.s++;
  }
}
function musicStart(){
  if(!save.music||MU.on)return;
  var c=ac();if(!c)return;
  if(!MU.g){MU.g=c.createGain();MU.g.gain.value=MU.vol;MU.g.connect(c.destination)}
  MU.on=true;MU.t=c.currentTime+.1;
  MU.timer=setInterval(musicTick,120);musicTick();
}
function musicStop(){MU.on=false;if(MU.timer){clearInterval(MU.timer);MU.timer=null}}
function duck(on){if(!MU.g||!actx)return;try{MU.g.gain.setTargetAtTime(on?.15:MU.vol,actx.currentTime,.12)}catch(e){}}
var canSpeak='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
var voice=null;
function pickVoice(){
  if(!canSpeak)return;
  try{
    var vs=speechSynthesis.getVoices();
    voice=vs.filter(function(v){return /^en[-_]US/i.test(v.lang)&&/female|samantha|google|zira|aria|jenny/i.test(v.name)})[0]||vs.filter(function(v){return /^en/i.test(v.lang)})[0]||null;
  }catch(e){}
}
if(canSpeak){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function speak(text){
  if(playClip(nk(text)))return true;
  if(VA){try{VA.pause()}catch(e){}}
  if(!canSpeak)return false;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';if(voice)u.voice=voice;u.rate=.85;u.pitch=1.1;

}

var S={db:null,mode:'local',ready:false,canWrite:true,players:{},rewards:[],err:false};
function dateStr(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function todayStr(){return dateStr(new Date())}
function yestStr(){return dateStr(new Date(Date.now()-864e5))}
function slug(s){
  var t=String(s||'').toLowerCase();
  try{t=t.normalize('NFD').replace(/[̀-ͯ]/g,'')}catch(e){}
  t=t.replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return t||'p';
}
function newPlayer(name,avatar){return {name:name,avatar:avatar,stars:0,points:0,equip:'none',best:{},streak:0,lastDay:'',plays:0}}
function P(id){return S.players[id]||null}

function teamStars(){var n=0;for(var k in S.players)n+=(S.players[k].stars||0);return n}
function flash(msg){
  var old=$('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.remove()},2800);
}
var wq={};
function qwrite(key,fn){
  var prev=wq[key]||Promise.resolve();
  var next=prev.then(fn).then(function(){S.err=false}).catch(function(){S.err=true;flash('Chưa lưu được lên sổ điểm chung.')});
  wq[key]=next;return next;
}
function savePlayer(id,patch){
  var p=S.players[id];if(!p)return;
  for(var k in patch){
    if(k==='best')p.best=Object.assign({},p.best||{},patch.best);
    else p[k]=patch[k];
  }
  if(S.mode==='cloud'){
    qwrite('p'+id,function(){
      return S.db.doc('players/'+id).update(patch).catch(function(e){
        if(e&&e.code==='invalid_argument')return S.db.doc('players/'+id).set(Object.assign({},p));
        throw e;
      });
    });
  }else{save.lp=S.players;persist()}
}
function createPlayer(name,avatar){
  var id=slug(name)+'-'+Math.random().toString(36).slice(2,5);
  var p=newPlayer(name,avatar);S.players[id]=p;
  if(S.mode==='cloud')qwrite('p'+id,function(){return S.db.doc('players/'+id).set(p)});
  else{save.lp=S.players;persist()}
  return id;
}
function addReward(title,at){
  var id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);
  var r={id:id,title:title,at:at,done:false};
  S.rewards.push(r);
  if(S.mode==='cloud')qwrite('r'+id,function(){return S.db.doc('rewards/'+id).set({title:title,at:at,done:false})});
  else{save.lr=S.rewards;persist()}
}
function patchReward(id,patch){
  var r=S.rewards.filter(function(x){return x.id===id})[0];if(!r)return;
  Object.assign(r,patch);
  if(S.mode==='cloud')qwrite('r'+id,function(){return S.db.doc('rewards/'+id).update(patch)});
  else{save.lr=S.rewards;persist()}
}
function removeReward(id){
  S.rewards=S.rewards.filter(function(x){return x.id!==id});
  if(S.mode==='cloud')qwrite('r'+id,function(){return S.db.doc('rewards/'+id).delete()});
  else{save.lr=S.rewards;persist()}
}
function refresh(){
  if(!S.ready)return;
  var ae=document.activeElement;if(ae&&ae.tagName==='INPUT')return;
  if(screen==='home')renderHome();
  else if(screen==='family')renderFamily();
  else if(screen==='players')renderPlayers(pmode);
  else if(screen==='wardrobe')renderWardrobe();
}
function initStore(done){
  var finished=false;
  function go(){if(finished)return;finished=true;S.ready=true;done()}
  function local(){
    S.mode='local';
    S.players=save.lp||{};
    if(!Object.keys(S.players).length){S.players={nami:newPlayer('Nami','🐱')};save.lp=S.players}
    S.rewards=save.lr||[];
    if(!S.rewards.length){
      S.rewards=[{id:'r1',title:'Cả nhà đi ăn kem',at:40,done:false},{id:'r2',title:'Chọn phim tối cuối tuần',at:100,done:false},{id:'r3',title:'Nami chọn một chuyến đi chơi',at:250,done:false}];
      save.lr=S.rewards;
    }
    if(!S.players[save.me])save.me=Object.keys(S.players)[0];
    persist();go();
  }
  var c=window.claude;
  if(!c||!c.use){local();return}
  Promise.all([c.use('db'),c.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db){local();return}
    S.db=db;S.mode='cloud';
    try{Promise.resolve(user&&typeof user.can==='function'?user.can('data.write'):null).then(function(v){S.canWrite=v!==false;if(S.ready)refresh()}).catch(function(){})}catch(e){}
    var t=setTimeout(go,5000);
    db.collection('players').onSnapshot(function(snap){
      var m={};snap.docs.forEach(function(d){m[d.id]=Object.assign({},d.data())});
      S.players=m;clearTimeout(t);
      if(!S.ready)go();else refresh();
    },function(){
      if(!S.ready){clearTimeout(t);local()}else{S.err=true;refresh()}
    });
    db.collection('rewards').onSnapshot(function(snap){
      S.rewards=snap.docs.map(function(d){var x=Object.assign({id:d.id},d.data());return x});
      if(S.ready)refresh();
    },function(){});
  }).catch(local);
}

/* ---------- quiz ---------- */
function startRound(id){
  var t=ALLTOPICS.filter(function(x){return x.id===id})[0],lv=lvl();
  var picks=[],seenE={};
  shuffle(t.words).forEach(function(w){if(picks.length<Math.min(lv.n,t.words.length)&&!seenE[w.emo]){seenE[w.emo]=1;picks.push(w)}});
  var maxTok=lv.id===3?12:8;
  var types=shuffle(lv.bag.slice()).slice(0,picks.length);
  var len=function(w){return sentTokens(w).length};
  var byLen=picks.map(function(_,i){return i}).sort(function(a,b){return len(picks[a])-len(picks[b])});
  var assign=new Array(picks.length),oi=0;
  types.forEach(function(ty){if(ty==='order'&&oi<picks.length)assign[byLen[oi++]]=len(picks[byLen[oi-1]])<=maxTok?'order':'fill'});
  var rest=shuffle(types.filter(function(ty){return ty!=='order'})),k=0;
  for(var i=0;i<picks.length;i++)if(!assign[i])assign[i]=rest[k++]||'see';
  var ids=(duo&&P(duo))?[save.me,duo]:[save.me];
  var tally={};ids.forEach(function(i){tally[i]={stars:0,pts:0,ok:0,n:0}});
  var q=shuffle(picks.map(function(w,i){return {w:w,type:assign[i],retry:false}}));
  q.forEach(function(x,i){x.pl=i%ids.length;tally[ids[x.pl]].n++});
  R={topic:t,lv:lv,picks:picks,q:q,i:0,ids:ids,tally:tally,streak:0,done:{},missed:{},res:null,opts:[],sp:null,peek:false,timeout:false};
  renderQuiz();
}
function distract(w,n){
  var out=[],seen={};seen[w.emo]=1;
  function take(list){shuffle(list).forEach(function(x){if(out.length<n&&x!==w&&x.en!==w.en&&!seen[x.emo]){seen[x.emo]=1;out.push(x)}})}
  take(BYT[w.t]||R.topic.words);
  if(out.length<n)take(MIX.words);
  return out;
}
function totalStars(){var n=0;R.ids.forEach(function(i){n+=R.tally[i].stars});return n}
function renderQuiz(){
  screen='quiz';app.className='';
  app.innerHTML='<div class="qhead"><button class="xbtn" data-act="quit" aria-label="Thoát">✕</button><div class="bar"><i id="prog" style="width:0%"></i></div><div class="pill sm">⭐ <b id="qs">0</b></div><button class="round" style="width:36px;height:36px;font-size:16px" data-act="music" aria-label="Bật tắt nhạc nền">'+(save.music?'🎵':'🔕')+'</button></div>'
  +'<div class="timer" id="timer"'+(R.lv.id===3?'':' hidden')+'><i id="tbar"></i></div>'
  +'<div class="coach"><div id="coachm">'+mochi('idle',equipOf(R.ids[0]))+'</div><div class="bubble"><div class="en" id="pen"></div><div class="vi" id="pvi"></div></div></div>'
  +'<div id="stage"></div><div class="sheet" id="sheet" role="status" aria-live="polite"></div>';
  setupQuestion();
  top();
}
function setPrompt(a,b){$('#pen').textContent=a;$('#pvi').textContent=b}
function startTimer(sec){
  stopTimer();
  if(R.lv.id!==3)return;
  var end=Date.now()+sec*1000,bar=$('#tbar');
  bar.style.width='100%';bar.classList.remove('low');
  tmr=setInterval(function(){
    var left=end-Date.now(),p=Math.max(0,left/(sec*1000));
    bar.style.width=(p*100)+'%';
    if(p<.25)bar.classList.add('low');
    if(left<=0){stopTimer();if(R&&!R.res){R.timeout=true;finish(false,null)}}
  },100);
}
Object.assign(PROMPT,{
 tf:['True or false?','Từ này có đúng với hình không?'],
 trans:['Say it in English!','Từ tiếng Anh của từ này là gì?'],
 vi:['What does it mean?','Từ này nghĩa là gì?'],
 odd:['Odd one out!','Từ nào không cùng nhóm?'],
 order:['Make a sentence!','Sắp xếp các từ thành câu đúng.'],
 hspell:['Listen and spell!','Nghe rồi ghép chữ cái thành từ.']
});
var TBI={};TOPICS.forEach(function(t){TBI[t.id]=t});
function sentTokens(w){return w.s.replace('___',w.en).split(' ')}
function setupQuestion(){
  var q=R.q[R.i],w=q.w,lv=R.lv,pid=R.ids[q.pl],ty=q.type;
  R.res=null;R.timeout=false;q.ans=w;
  R.peek=!canSpeak;
  var nopt=(lv.id===1||q.retry)?3:4;
  if(ty==='see'||ty==='hear'||ty==='fill'||ty==='trans'||ty==='vi')R.opts=shuffle([w].concat(distract(w,nopt-1)));
  if(ty==='odd'){
    var same=shuffle((BYT[w.t]||[]).filter(function(x){return x!==w&&x.emo!==w.emo})).slice(0,2);
    var seenE={};seenE[w.emo]=1;same.forEach(function(x){seenE[x.emo]=1});
    var out=shuffle(MIX.words.filter(function(x){return x.t!==w.t&&!seenE[x.emo]}))[0];
    q.ans=out;R.opts=shuffle([w].concat(same,[out]));
  }
  if(ty==='tf'){
    var truth=Math.random()<.5,shown=w;
    if(!truth)shown=distract(w,1)[0]||w;
    R.tf={shown:shown,truth:shown===w};
  }
  if(ty==='order'){
    var tk=sentTokens(w),tiles=shuffle(tk.map(function(t){return {t:t,used:false}}));
    if(tiles.map(function(x){return x.t}).join(' ')===tk.join(' '))tiles.reverse();
    R.ord={target:tk,tiles:tiles,picked:[]};
  }
  if(ty==='spell'||ty==='hspell'){
    var letters=w.en.replace(/ /g,'');
    var pool='abcdefghijklmnopqrstuvwxyz'.split('').filter(function(c){return letters.indexOf(c)<0});
    var ne=lv.id===1?0:lv.id===2?(letters.length>5?3:2):4;
    var tl=shuffle(letters.split('').concat(shuffle(pool).slice(0,ne))).map(function(ch){return {ch:ch,used:false}});
    var slots=[];for(var s=0;s<letters.length;s++)slots.push(null);
    R.sp={letters:letters,tiles:tl,slots:slots};
  }
  var p=q.retry?PROMPT.retry:PROMPT[ty];
  var pl=P(pid);
  setPrompt(p[0],(R.ids.length>1&&pl?'Lượt của '+pl.name+' · ':'')+p[1]);
  if(R.ids.length>1)$('#coachm').innerHTML=mochi('idle',equipOf(pid));
  else setMood($('#coachm .mochi'),'idle');
  $('#sheet').classList.remove('show');app.classList.remove('has-sheet');
  $('#prog').style.width=Math.round(Object.keys(R.done).length/R.picks.length*100)+'%';
  $('#qs').textContent=totalStars();
  drawStage();
  if(ty==='hear'||ty==='hspell')setTimeout(function(){if(R&&R.q[R.i]===q&&!R.res)speak(w.en)},450);
  startTimer(ty==='order'?50:(ty==='spell'||ty==='hspell')?40:20);
}
function optCls(o){
  if(!R.res)return '';
  var q=R.q[R.i];
  if(o===q.ans)return ' ok';
  if(o===R.res.pick)return ' bad';
  return ' dim';
}
function optBtns(kind){
  return R.opts.map(function(o,i){
    var label=kind==='emo'?o.emo:kind==='vi'?esc(o.vi):esc(o.en);
    return '<button class="opt'+(kind==='emo'?' emo':'')+optCls(o)+'" data-act="pick" data-i="'+i+'"'+(R.res?' disabled':'')+'>'+label+'</button>';
  }).join('');
}
function drawStage(){
  var q=R.q[R.i],w=q.w,lv=R.lv,ty=q.type,h='';
  var tint=(TBI[w.t]||R.topic).tint;
  if(ty==='hear'){
    var canPeek=!canSpeak||lv.id<3;
    h='<div class="stage"><button class="speaker" data-act="say" aria-label="Nghe lại">'+SPK+'</button>'
    +((R.peek||R.res||!canSpeak)?'<div class="peek">'+esc(w.en)+'</div>':(canPeek?'<button class="link" data-act="peek">Không nghe được? Xem chữ</button>':''))
    +'<div class="grid2">'+optBtns('emo')+'</div></div>';
  }else if(ty==='see'){
    h='<div class="stage" style="--tint:'+tint+'"><div class="bigemo">'+w.emo+'</div><div class="grid2">'+optBtns('txt')+'</div></div>';
  }else if(ty==='fill'){
    var parts=w.s.split('___');
    h='<div class="stage" style="--tint:'+tint+'"><div class="sentence">'+((lv.id<3||R.res)?'<div class="semo">'+w.emo+'</div>':'')+'<p class="stext">'+esc(parts[0])+'<span class="blank'+(R.res?' on':'')+'">'+(R.res?esc(w.en):'&nbsp;')+'</span>'+esc(parts[1])+'</p></div><div class="stack">'+optBtns('txt')+'</div></div>';
  }else if(ty==='trans'){
    h='<div class="stage" style="--tint:'+tint+'"><div class="bigvi">'+esc(w.vi)+'</div>'+((lv.id<3||R.res)?'<div class="semo">'+w.emo+'</div>':'')+'<div class="grid2">'+optBtns('txt')+'</div></div>';
  }else if(ty==='vi'){
    h='<div class="stage" style="--tint:'+tint+'"><div class="row"><div class="bigvi">'+esc(w.en)+'</div><button class="speaker sm" data-act="say" aria-label="Nghe từ">'+SPK+'</button></div>'+((lv.id<3||R.res)?'<div class="semo">'+w.emo+'</div>':'')+'<div class="stack">'+optBtns('vi')+'</div></div>';
  }else if(ty==='odd'){
    h='<div class="stage"><div class="meaning">'+((lv.id<3||R.res)?'Nhóm chính: '+esc(TBI[w.t].vi):'Bốn từ, một từ lạc nhóm')+'</div><div class="grid2">'+optBtns('txt')+'</div></div>';
  }else if(ty==='tf'){
    var f=R.tf,mk=function(v){return R.res?(v===f.truth?' ok':(R.res.pick===v?' bad':' dim')):''};
    h='<div class="stage" style="--tint:'+tint+'"><div class="bigemo">'+w.emo+'</div><div class="tfword">'+esc(f.shown.en)+'</div><div class="grid2"><button class="opt'+mk(true)+'" data-act="tf" data-v="1"'+(R.res?' disabled':'')+'>Đúng ✓</button><button class="opt'+mk(false)+'" data-act="tf" data-v="0"'+(R.res?' disabled':'')+'>Sai ✗</button></div></div>';
  }else if(ty==='order'){
    var od=R.ord,cls=R.res?(R.res.ok?' ok':' bad'):'';
    var picked=od.picked.map(function(ti,pos){return '<button class="oc" data-act="ounpick" data-i="'+pos+'"'+(R.res?' disabled':'')+'>'+esc(od.tiles[ti].t)+'</button>'}).join('');
    var full=od.picked.length===od.tiles.length;
    h='<div class="stage" style="--tint:'+tint+'">'+((lv.id<3||R.res)?'<div class="row"><div class="semo">'+w.emo+'</div><div class="meaning">'+esc(w.vi)+'</div></div>':'')
    +'<div class="ostrip'+cls+'">'+(picked||'<span class="ph">Chạm các từ bên dưới theo đúng thứ tự</span>')+'</div>'
    +(R.res&&!R.res.ok?'<div class="fixs">'+esc(od.target.join(' '))+'</div>':'')

function finish(ok,pick){
  stopTimer();
  var q=R.q[R.i],w=q.w,lv=R.lv,pid=R.ids[q.pl],T=R.tally[pid],gained=0;
  R.res={ok:ok,pick:pick};
  if(ok){
    R.streak++;R.done[w.en]=1;
    if(!q.retry){gained=lv.pts+(R.streak>=3?5:0);T.stars+=lv.mult;T.pts+=gained;T.ok++}
  }else{
    R.streak=0;R.missed[w.en]=1;
    if(q.retry)R.done[w.en]=1;else R.q.push({w:w,type:'see',retry:true,pl:q.pl});
  }
  $('#prog').style.width=Math.round(Object.keys(R.done).length/R.picks.length*100)+'%';
  $('#qs').textContent=totalStars();
  setMood($('#coachm .mochi'),ok?'happy':'sad');
  if(ok){setPrompt('Yay!','Giỏi lắm!');sfx.ok()}else{setPrompt(R.timeout?"Time's up!":'Oh no!',R.timeout?'Hết giờ rồi, cố lên nhé!':'Không sao, cố lên nhé!');sfx.bad()}
  drawStage();
  var say=(q.type==='fill'||q.type==='order')?w.s.replace('___',w.en):(q.ans||w).en;
  setTimeout(function(){speak(say)},350);
  showSheet(ok,gained);
}
function showSheet(ok,gained){
  var q=R.q[R.i],w=q.w,ans=q.ans||w,sh=$('#sheet'),title,detail;
  var last=R.i===R.q.length-1;
  if(ok){
    var p=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    title=p[0];
    var core=q.type==='odd'?' <b>'+esc(ans.en)+'</b> ('+esc(ans.vi)+') là từ lạc nhóm.':q.type==='order'?' Câu đúng rồi!':' <b>'+esc(ans.en)+'</b> nghĩa là '+esc(ans.vi)+'.';
    detail=p[1]+core+(gained?'<br>+'+gained+' điểm':'')+(R.streak>=3?' · 🔥 '+R.streak+' câu đúng liên tiếp!':'');
  }else{
    title=R.timeout?'Hết giờ rồi!':'Oops, gần đúng rồi!';
    var core2=q.type==='odd'?'Từ lạc nhóm là <b>'+esc(ans.en)+'</b> ('+esc(ans.vi)+').':q.type==='order'?'Câu đúng: <b>'+esc(R.ord.target.join(' '))+'</b>':'Đáp án đúng: <b>'+esc(ans.en)+'</b> ('+esc(ans.vi)+').';

function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var box=document.createElement('div');box.className='confetti';
  var cols=['#FF86AE','#FFC94D','#6FD3B5','#8DC6FF','#B9A2FF'];
  for(var i=0;i<36;i++){
    var p=document.createElement('i');
    p.style.left=(Math.random()*100)+'%';p.style.background=cols[i%cols.length];
    p.style.animationDuration=(2.2+Math.random()*2)+'s';p.style.animationDelay=(Math.random()*.8)+'s';
    box.appendChild(p);
  }

function finishRound(){
  var lv=R.lv,day=todayStr(),y=yestStr(),teamBefore=teamStars();
  var okT=0,nT=0;
  R.ids.forEach(function(id){okT+=R.tally[id].ok;nT+=R.tally[id].n});
  var duoBonus=(R.ids.length>1&&nT&&okT/nT>=.75)?lv.mult*2:0;
  var results=[];
  R.ids.forEach(function(id){
    var p=P(id);if(!p)return;
    var T=R.tally[id],bonusDaily=0,streak=p.streak||0;
    if(p.lastDay!==day){bonusDaily=2;streak=(p.lastDay===y)?streak+1:1}
    var gain=T.stars+bonusDaily+duoBonus,before=p.stars||0,after=before+gain;
    var fresh=[];
    var key=R.topic.id+'_'+lv.id,best=Math.max((p.best||{})[key]||0,T.ok);
    var patch={stars:after,points:(p.points||0)+T.pts,plays:(p.plays||0)+1,streak:streak,lastDay:day,best:{}};
    patch.best[key]=best;
    if(fresh.length)patch.equip=fresh[fresh.length-1].id;
    savePlayer(id,patch);
    fresh=grantGifts(id,1+(T.n&&T.ok/T.n>=.8?1:0)+(T.n&&T.ok===T.n?1:0));
    results.push({id:id,p:p,T:T,gain:gain,bonusDaily:bonusDaily,duoBonus:duoBonus,fresh:fresh,streak:streak});
  });
  var teamAfter=teamStars();
  var opened=S.rewards.filter(function(r){return !r.done&&teamBefore<r.at&&teamAfter>=r.at});
  renderResult(results,opened,okT,nT);
}
function renderResult(results,opened,okT,nT){
  stopTimer();screen='result';
  var f=nT?okT/nT:0,title,sub,mood=f>=.6?'happy':'idle';
  if(f===1){title='Perfect!';sub='Siêu sao tiếng Anh!'}
  else if(f>=.75){title='Great job!';sub='Giỏi quá, Chopper tự hào lắm!'}
  else if(f>=.5){title='Good try!';sub='Khá lắm! Chơi lại để được nhiều sao hơn nhé.'}
  else{title='Keep going!';sub='Không sao đâu, luyện thêm một vòng nữa nha.'}
  var stars='';for(var i=0;i<nT;i++)stars+='<span'+(i<okT?' class="on"':'')+'>★</span>';
  var cards=results.map(function(r){
    var lines=['+'+r.T.stars+' ⭐ từ '+r.T.ok+'/'+r.T.n+' câu đúng','+'+r.T.pts+' điểm'];
    if(r.bonusDaily)lines.push('+'+r.bonusDaily+' ⭐ thưởng chơi hôm nay · 🔥 '+r.streak+' ngày liền');
    if(r.duoBonus)lines.push('+'+r.duoBonus+' ⭐ thưởng chơi cặp đôi');
    var fr=giftHTML(r.p.name,r.fresh);
    return '<div class="rcard">'+avc(r.p)+'<div class="rcb"><b>'+esc(r.p.name)+' · +'+r.gain+' ⭐</b><small>'+lines.join('<br>')+'</small></div></div>'+fr;
  }).join('');
  var banner=opened.map(function(r){return '<div class="unlock"><div class="ue">🎉</div><div><b>Cả nhà mở được phần thưởng!</b>'+esc(r.title)+'</div></div>'}).join('');
  var chips=R.picks.map(function(w){return '<button class="chip'+(R.missed[w.en]?' miss':'')+'" data-act="sayw" data-w="'+esc(w.en)+'">'+w.emo+' '+esc(w.en)+'</button>'}).join('');
  var anyFresh=results.some(function(r){return r.fresh.length});
  app.className='';
  app.innerHTML='<div class="result"><div class="rmochi">'+mochi(mood,equipOf(results[0]&&results[0].id))+'</div><h1 class="rtitle">'+title+'</h1><p class="rsub">'+sub+' ('+R.lv.name+')</p>'
  +'<div class="starrow" aria-label="'+okT+' trên '+nT+' câu đúng">'+stars+'</div>'
  +cards+banner
  +'<h3 class="sec" style="margin:6px 0 0">Từ hôm nay (chạm để nghe)</h3><div class="chips">'+chips+'</div>'
  +'<div class="syncnote">'+syncText()+'</div>'
  +'<div class="rbtns"><button class="btn pink" data-act="again">Chơi lại chủ đề này</button>'
  +(anyFresh?'<button class="btn green" data-act="wardrobe">Về nhà Chopper xem quà</button>':'')
  +(opened.length?'<button class="btn green" data-act="family">Xem phần thưởng cả nhà</button>':'')
  +'<button class="btn plain" data-act="home">Về trang chủ</button></div></div>';
  top();
  if(f>=.6||anyFresh||opened.length){sfx.win();confetti()}
  if(anyFresh)setTimeout(function(){sayVi('Chopper có quà mới!')},1500);
}

  if(!p)return {own:DEF.slice(),wear:Object.assign({},DEFW),gd:[]};
  if(!p.own){
    var own=DEF.slice(),wear=Object.assign({},DEFW);

  var st=pstate(id),own=st.own.slice(),wear=Object.assign({},st.wear),gd=st.gd.slice();

  var m=MINIS.filter(function(x){return x[0]===g})[0];
  app.innerHTML='<div class="qhead"><button class="xbtn" data-act="home" aria-label="Thoát">‹</button><div class="bar sun" style="flex:1"><i id="mgp" style="width:0"></i></div><button class="round" data-act="mgsay" aria-label="Nghe lại">🔊</button></div>'
  +'<div class="coach"><div id="coachm">'+mochi('idle')+'</div><div class="bubble"><div class="en" id="pen">'+m[2]+'</div><div class="vi" id="pvi">'+m[3]+'</div></div></div><div id="mg"></div>';
  top();({balloon:mgBalloon,memory:mgMemory,letter:mgLetter,match:mgMatch})[g]();
}
function mgBalloon(){
  var words=miniWords(8),i=0,ok=0,missed={},cur=null,bad=false,iv=null,box;
  $('#mg').innerHTML='<div class="sky2" id="sky2"></div>';box=$('#sky2');
  MG.clean=function(){clearInterval(iv)};
  function next(){
    [].forEach.call(box.querySelectorAll('.bl'),function(b){b.remove()});
    if(i>=words.length){MG.clean();miniFinish(ok,words.length,words,missed);return}
    cur=words[i];bad=false;mgProg(i,words.length);mgPrompt(lvl().id===1?cur.en:'Listen!','Chạm bóng bay có hình đúng nhé',cur.en);setTimeout(spawn,300);
  }
  function spawn(){
    if(!MG||!cur||!box.isConnected||box.querySelectorAll('.bl').length>6)return;
    var tgt=cur,has=box.querySelector('.bl[data-t="1"]'),isT=!has||Math.random()<.3;
    var w=isT?tgt:shuffle(MIX.words.filter(function(x){return x.emo!==tgt.emo}))[0];
    var b=document.createElement('button');b.className='bl';if(isT)b.dataset.t='1';
    b.style.left=(3+Math.random()*74)+'%';b.style.setProperty('--h',Math.floor(Math.random()*360));b.style.animationDuration=(5.5+Math.random()*2.5)+'s';b.innerHTML='<span>'+w.emo+'</span>';
    b.addEventListener('animationend',function(e){if(e.animationName==='blrise')b.remove()});
    b.addEventListener('pointerdown',function(e){
      e.preventDefault();if(cur!==tgt||b.classList.contains('pop'))return;
      if(isT){b.classList.add('pop');sfx.ok();mgMood('happy');if(bad)missed[tgt.en]=1;else ok++;i++;cur=null;setTimeout(next,650)}
      else{sfx.bad();bad=true;mgMood('sad');b.classList.add('shk');setTimeout(function(){b.classList.remove('shk')},400)}
    });
    box.appendChild(b);
  }
  iv=setInterval(spawn,850);next();
}
function mgMemory(){
  var words=miniWords(6),cards=shuffle(words.map(function(w){return {w:w,t:0}}).concat(words.map(function(w){return {w:w,t:1}}))),open=[],lock=false,found=0,wrong=0,missed={};
  $('#mg').innerHTML='<div class="mem2">'+cards.map(function(c,k){return '<button class="mc2" data-k="'+k+'"><i class="bk">🐾</i><i class="ft'+(c.t?' em':'')+'">'+(c.t?c.w.emo:esc(c.w.en))+'</i></button>'}).join('')+'</div>';
  mgPrompt('Find the pairs!','Lật 2 thẻ: một từ và một hình giống nhau','Find the pairs!');
  [].forEach.call(document.querySelectorAll('.mc2'),function(el){el.addEventListener('click',function(){
    if(lock||el.classList.contains('up'))return;var c=cards[+el.dataset.k];el.classList.add('up');sfx.tap();if(!c.t)speak(c.w.en);open.push([el,c]);
    if(open.length<2)return;var a=open[0],b=open[1];open=[];lock=true;
    if(a[1].w===b[1].w&&a[1].t!==b[1].t){setTimeout(function(){if(!MG)return;a[0].classList.add('ok');b[0].classList.add('ok');sfx.ok();mgMood('happy');speak(a[1].w.en);found++;mgProg(found,6);lock=false;
      if(found===6)setTimeout(function(){if(MG)miniFinish(Math.max(1,6-Math.floor(wrong/2)),6,words,missed)},900)},450)}
    else setTimeout(function(){if(!MG)return;wrong++;missed[a[1].w.en]=1;a[0].classList.remove('up');b[0].classList.remove('up');mgMood('sad');lock=false},950);
  })});
}
function mgLetter(){
  var words=miniWords(14).filter(function(w){return /^[a-z]{3,7}$/.test(w.en)}).slice(0,8),i=0,ok=0,missed={};
  function next(){
    if(i>=words.length){miniFinish(ok,words.length,words,missed);return}
    var w=words[i],k=Math.floor(Math.random()*w.en.length),L=w.en[k],bad=false,done=false;
    var opts=[L];shuffle('abcdefghijklmnopqrstuvwxyz'.split('')).forEach(function(c){if(opts.length<4&&opts.indexOf(c)<0)opts.push(c)});opts=shuffle(opts);
    mgProg(i,words.length);mgPrompt('Which letter is missing?','Chọn chữ cái còn thiếu',lvl().id>1?w.en:'');
    $('#mg').innerHTML='<div class="lstage"><div class="lemo">'+w.emo+'</div><div class="lword">'+w.en.split('').map(function(c,j){return '<span'+(j===k?' class="gap" id="gap"':'')+'>'+(j===k?'_':c)+'</span>'}).join('')+'</div><div class="lvi">'+esc(w.vi)+'</div></div><div class="opts c2">'+opts.map(function(c){return '<button class="opt" data-c="'+c+'">'+c+'</button>'}).join('')+'</div>';
    [].forEach.call(document.querySelectorAll('#mg .opt'),function(b){b.addEventListener('click',function(){
      if(done)return;
      if(b.dataset.c===L){done=true;b.classList.add('ok');$('#gap').textContent=L;$('#gap').classList.add('fill');sfx.ok();mgMood('happy');speak(w.en);if(bad)missed[w.en]=1;else ok++;i++;setTimeout(function(){if(MG)next()},1300)}
      else{bad=true;b.classList.add('bad');b.disabled=true;sfx.bad();mgMood('sad')}
    })});
  }
  next();
}
function mgMatch(){
  var all=miniWords(10),round=0,wrong=0,missed={},total=0;
  function next(){
    if(round>=2){miniFinish(Math.max(1,10-wrong),10,all,missed);return}
    var set=all.slice(round*5,round*5+5),L=shuffle(set),Rr=shuffle(set),sel=null,got=0;
    mgPrompt('Match them!','Chạm một từ, rồi chạm hình của từ đó','Match them!');
    $('#mg').innerHTML='<div class="mcols2"><div>'+L.map(function(w){return '<button class="mt2" data-s="L" data-w="'+esc(w.en)+'">'+esc(w.en)+'</button>'}).join('')+'</div><div>'+Rr.map(function(w){return '<button class="mt2 em" data-s="R" data-w="'+esc(w.en)+'">'+w.emo+'</button>'}).join('')+'</div></div>';
    [].forEach.call(document.querySelectorAll('.mt2'),function(b){b.addEventListener('click',function(){
      if(b.classList.contains('done'))return;
      if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');sfx.tap();if(b.dataset.s==='L')speak(b.dataset.w);return}
      if(sel.dataset.w===b.dataset.w){[sel,b].forEach(function(x){x.classList.remove('sel');x.classList.add('done')});sfx.ok();mgMood('happy');speak(b.dataset.w);sel=null;got++;total++;mgProg(total,10);
        if(got===5){round++;setTimeout(function(){if(MG)next()},900)}}
      else{wrong++;missed[sel.dataset.s==='L'?sel.dataset.w:b.dataset.w]=1;var a=sel;sel=null;a.classList.remove('sel');sfx.bad();mgMood('sad');[a,b].forEach(function(x){x.classList.add('bad');setTimeout(function(){x.classList.remove('bad')},400)})}
    })});
  }
  next();
}
function miniFinish(ok,n,words,missed){
  var g=MG?MG.g:'balloon';if(MG&&MG.clean)MG.clean();MG=null;
  var id=curId(),p=P(id);if(!p){renderHome();return}
  var lv=lvl(),day=todayStr(),y=yestStr(),bonus=0,streak=p.streak||0,teamBefore=teamStars();
  if(p.lastDay!==day){bonus=2;streak=(p.lastDay===y)?streak+1:1}
  var gain=ok*lv.mult+bonus,pts=ok*lv.pts;
  savePlayer(id,{stars:(p.stars||0)+gain,points:(p.points||0)+pts,plays:(p.plays||0)+1,streak:streak,lastDay:day});
  var gifts=grantGifts(id,1+(ok/n>=.8?1:0)+(ok===n?1:0)),teamAfter=teamStars();
  var opened=S.rewards.filter(function(r){return !r.done&&teamBefore<r.at&&teamAfter>=r.at});
  screen='result';app.className='';
  var f=ok/n,title=f===1?'Perfect!':f>=.75?'Great job!':f>=.5?'Good try!':'Keep going!',sub=f===1?'Siêu sao tiếng Anh!':f>=.75?'Giỏi quá, Chopper tự hào lắm!':f>=.5?'Khá lắm! Chơi lại để được nhiều sao hơn nhé.':'Không sao đâu, luyện thêm một vòng nữa nha.';
  var stars='';for(var i=0;i<n;i++)stars+='<span'+(i<ok?' class="on"':'')+'>★</span>';
  var lines=['+'+ok*lv.mult+' ⭐ từ '+ok+'/'+n+' lượt đúng','+'+pts+' điểm'];if(bonus)lines.push('+'+bonus+' ⭐ thưởng chơi hôm nay · 🔥 '+streak+' ngày liền');
  app.innerHTML='<div class="result"><div class="rmochi">'+mochi(f>=.5?'happy':'idle')+'</div><h1 class="rtitle">'+title+'</h1><p class="rsub">'+sub+'</p>'
  +'<div class="starrow">'+stars+'</div><div class="rcard">'+avc(p)+'<div class="rcb"><b>'+esc(p.name)+' · +'+gain+' ⭐</b><small>'+lines.join('<br>')+'</small></div></div>'+giftHTML(p.name,gifts)
  +opened.map(function(r){return '<div class="unlock"><div class="ue">🎉</div><div><b>Cả nhà mở được phần thưởng!</b>'+esc(r.title)+'</div></div>'}).join('')
  +'<h3 class="sec" style="margin:6px 0 0">Từ hôm nay (chạm để nghe)</h3><div class="chips">'+words.map(function(w){return '<button class="chip'+(missed[w.en]?' miss':'')+'" data-act="sayw" data-w="'+esc(w.en)+'">'+w.emo+' '+esc(w.en)+'</button>'}).join('')+'</div>'
  +'<div class="rbtns"><button class="btn pink" data-act="mini" data-g="'+g+'">Chơi lại</button><button class="btn green" data-act="wardrobe">Về nhà Chopper xem quà</button><button class="btn plain" data-act="home">Về trang chủ</button></div></div>';
  top();sfx.win();confetti();speak(title);setTimeout(function(){sayVi('Chopper có quà mới!')},1500);
}

renderSplash();
initStore(function(){renderHome()});
})();

</script>
