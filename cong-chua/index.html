<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Công Chúa Xinh Đẹp</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;color:#5b2a6e}
body{position:fixed;inset:0;background:linear-gradient(160deg,#ffd1ec,#e3c9ff 55%,#c5e4ff);touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;border:0;color:inherit;cursor:pointer;padding:0;background:none}
#safe{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);pointer-events:none}
#app{position:absolute;left:0;top:0;width:390px;height:720px;transform-origin:0 0;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#ffe3f4,#f1e2ff)}
#app.framed{border-radius:34px;box-shadow:0 0 0 8px #fff,0 24px 60px rgba(120,60,150,.35)}
.top{display:flex;align-items:center;gap:6px;padding:8px 10px 6px}
.title{flex:1;font-weight:800;font-size:21px;line-height:1;background:linear-gradient(90deg,#ff4f9a,#a04bff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:50%;background:#fff;font-size:19px;display:grid;place-items:center;box-shadow:0 4px 0 #f0b8dc,0 6px 12px rgba(160,75,255,.2);flex:none}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #f0b8dc}
#stage{position:relative;flex:1;min-height:0;margin:0 10px;border-radius:26px;overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 6px #ffb3dc,0 10px 24px rgba(160,75,255,.3);background:#ffe9f6}
#stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.side{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:8px;z-index:3}
.side.l{right:auto;left:8px}
.pill{border-radius:99px;background:linear-gradient(180deg,#ff7fbf,#ff4f9a);color:#fff;font-weight:800;font-size:14px;padding:7px 12px;box-shadow:0 4px 0 #d12f7c,0 6px 12px rgba(255,79,154,.4);display:flex;align-items:center;gap:4px}
.pill.v{background:linear-gradient(180deg,#b98cff,#8a4bff);box-shadow:0 4px 0 #6a2fd6,0 6px 12px rgba(138,75,255,.4)}
.pill.g{background:linear-gradient(180deg,#ffd76a,#ffb21f);box-shadow:0 4px 0 #d98c00,0 6px 12px rgba(255,178,31,.4);color:#6b3a00}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 #d12f7c}
.spk{position:absolute;pointer-events:none;z-index:4;font-size:22px;animation:spk .9s ease-out forwards}
@keyframes spk{0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:0}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(40deg)}100%{transform:translate(-50%,-140%) scale(.4) rotate(120deg);opacity:0}}
.tool{position:absolute;z-index:5;font-size:44px;pointer-events:none;animation:tool .75s ease-in-out forwards;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
@keyframes tool{0%{transform:translate(-50%,120%) rotate(-30deg) scale(.6);opacity:0}35%{transform:translate(-50%,-50%) rotate(-10deg) scale(1.1);opacity:1}55%{transform:translate(-30%,-55%) rotate(12deg)}75%{transform:translate(-70%,-45%) rotate(-12deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.5);opacity:0}}
#stage.pop>svg #who{animation:bop .45s}
@keyframes bop{40%{transform:scale(1.035) translateY(-6px)}}
#who{transform-origin:200px 640px}
#stage.show>svg #who{animation:twirl 3.6s ease-in-out}
@keyframes twirl{0%,100%{transform:scaleX(1)}12%{transform:scaleX(-1) translateY(-10px)}25%{transform:scaleX(1)}45%{transform:scaleX(1) rotate(-4deg)}60%{transform:scaleX(1) rotate(4deg)}75%{transform:scaleX(-1) translateY(-10px)}88%{transform:scaleX(1)}}
.spot{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse 60% 70% at 50% 55%,rgba(255,255,255,0) 40%,rgba(60,20,90,.55) 100%)}
#stage.show .spot{opacity:1}
.banner{position:absolute;left:50%;top:12%;transform:translateX(-50%) scale(0);z-index:6;background:#fff;border-radius:22px;padding:8px 18px;text-align:center;font-weight:800;font-size:20px;color:#ff4f9a;box-shadow:0 6px 0 #ffb3dc,0 10px 24px rgba(160,75,255,.4);white-space:nowrap;transition:transform .45s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.banner small{display:block;font-size:24px;letter-spacing:2px}
#stage.show .banner{transform:translateX(-50%) scale(1)}
.fall{position:absolute;top:-30px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(760px) rotate(360deg)}}
.flash{position:absolute;inset:0;background:#fff;z-index:9;pointer-events:none;animation:flash .5s forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 10px 6px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar,.opts::-webkit-scrollbar,.cols::-webkit-scrollbar{display:none}
.tab{flex:none;min-width:54px;border-radius:16px;background:#fff;padding:3px 6px 2px;font-size:22px;line-height:1.15;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 #f0b8dc}
.tab small{font-size:10.5px;font-weight:800;white-space:nowrap;color:#a05cc0}
.tab.on{background:linear-gradient(180deg,#ff8fc8,#ff4f9a);box-shadow:0 3px 0 #d12f7c;transform:translateY(-2px)}
.tab.on small{color:#fff}
.panel{flex:none;height:178px;margin:0 10px 10px;border-radius:22px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 2px #fff,0 6px 14px rgba(160,75,255,.18);display:flex;flex-direction:column;overflow:hidden}
.cols{display:flex;gap:8px;overflow-x:auto;padding:8px 10px 2px;scrollbar-width:none;flex:none}
.sw{flex:none;width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.sw.on{outline:3px solid #ff4f9a;transform:scale(1.12)}
.opts{flex:1;display:flex;gap:8px;overflow-x:auto;padding:8px 10px;scrollbar-width:none;align-items:stretch}
.op{flex:none;width:86px;border-radius:16px;background:linear-gradient(180deg,#fff,#fff0fa);box-shadow:0 3px 0 #f0b8dc;overflow:hidden;position:relative;display:grid;place-items:center;font-size:34px}
.op svg{width:100%;height:100%;display:block}
.op.on{box-shadow:0 0 0 3px #ff4f9a,0 3px 0 #d12f7c}
.op.on::after{content:"✓";position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:#ff4f9a;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.ov{position:absolute;inset:0;z-index:20;background:rgba(70,25,100,.6);display:none;align-items:center;justify-content:center;padding:18px}
.ov.on{display:flex}
.card{background:#fff;border-radius:28px;padding:14px;width:100%;max-height:100%;display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 8px 0 #ffb3dc;animation:cin .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes cin{from{transform:scale(.6);opacity:0}}
.card h2{margin:0;font-size:22px;color:#ff4f9a}
.photo{border-radius:18px;overflow:hidden;border:6px solid #ffd76a;box-shadow:0 0 0 3px #fff inset;background:#ffe9f6;aspect-ratio:4/5;position:relative}
.photo svg,.photo img{width:100%;height:100%;display:block;object-fit:cover}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow-y:auto;padding:2px}
.ath{border-radius:14px;overflow:hidden;aspect-ratio:4/5;box-shadow:0 0 0 3px #ffd76a;position:relative;background:#ffe9f6}
.ath svg{width:100%;height:100%;display:block}
.ath b{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;font-size:12px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.note{font-size:13px;font-weight:600;color:#a05cc0;line-height:1.25}
#main .tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(40deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
</style>
</head>
<body>
<div id="safe"></div>
<div id="app">
  <div class="top">
    <div class="title">👑 Công Chúa Xinh Đẹp</div>
    <button class="ib" id="bMusic" aria-label="Nhạc">🎵</button>
    <button class="ib" id="bAlbum" aria-label="Album">💖</button>
    <button class="ib" id="bReset" aria-label="Làm lại">🧼</button>
  </div>
  <div id="stage">
    <svg id="main" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640"></svg>
    <div class="spot"></div>
    <div class="banner" id="banner"></div>
    <div class="side l"><button class="pill v" id="bRand">🎲 Ngẫu nhiên</button><button class="pill v" id="bZoom">🔍 Gần</button></div>
    <div class="side"><button class="pill" id="bShot">📸 Chụp ảnh</button><button class="pill g" id="bShow">🌟 Trình diễn</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel"><div class="cols" id="cols"></div><div class="opts" id="opts"></div></div>
  <div class="ov" id="ovPhoto"><div class="card"><h2>Ảnh công chúa của bé</h2><div class="photo" id="photo"></div><div class="note" id="pnote">Nhấn giữ vào ảnh để lưu về máy.</div><div class="row"><button class="pill" id="pSave">💖 Lưu vào album</button><button class="pill v" id="pClose">Đóng</button></div></div></div>
  <div class="ov" id="ovAlbum"><div class="card"><h2>Album công chúa</h2><div class="agrid" id="agrid"></div><div class="note" id="anote"></div><div class="row"><button class="pill v" id="aClose">Đóng</button></div></div></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],rnd=n=>Math.floor(Math.random()*n);
/* ---------- khung co giãn ---------- */
let ZS=1;
function fitApp(){const app=$('#app'),sb=$('#safe').getBoundingClientRect(),vw=sb.width||innerWidth,vh=sb.height||innerHeight;
 ZS=Math.max(.5,Math.min(vw/390,vh/640));const W=Math.min(Math.max(vw/ZS,320),480),H=vh/ZS,fr=vw-W*ZS>48,Hf=fr?Math.min(H-24/ZS,900):H;
 app.style.width=W+'px';app.style.height=Hf+'px';app.style.left=(sb.left+(vw-W*ZS)/2)+'px';app.style.top=(sb.top+(vh-Hf*ZS)/2)+'px';app.style.transform=`scale(${ZS})`;app.classList.toggle('framed',fr);if(window.setVB)setVB(true)}
/* ---------- dữ liệu ---------- */
const SKIN=[['#ffe6d6','#f6c4ab'],['#fcd7bd','#eeb090'],['#f3c5a0','#dea176'],['#dba57a','#bf8052'],['#b0764d','#8e5935'],['#80502f','#633a1d']];
const HAIRC=[['#3b2a26','#6a4a40'],['#7a4a2b','#b07a4c'],['#e8b53e','#ffe18f'],['#c9472b','#f58a5c'],['#ff6fa8','#ffc0da'],['#8a5cf0','#c9b0ff'],['#3a8dff','#9fd0ff'],['#22b894','#a4f1da'],['#aeb2c6','#f3f4fb'],['rainbow','']];
const EYEC=['#6b4226','#2f8d57','#2f6fd0','#8a5cf0','#d9488b','#e09a1f','#22a6a6','#5a6072'];

const BLUSHC=['#ff9aa8','#ffb38a','#ff7fb0','#d98cff','#ff6b6b'];
const DRC=[['#ff6fa8','#ffc4dd','#d9437b'],['#a06bff','#d9c4ff','#6f43d6'],['#3aa0ff','#bfe0ff','#1b6fcf'],['#2fcfa0','#b9f3e0','#129a72'],['#ffcf1f','#fff0a8','#d99a00'],['#ff5b5b','#ffc0c0','#c93030'],['#ffffff','#fff5fb','#e3cfe6'],['#3b2a5a','#8a6bd0','#1f1436'],['#ff9f1c','#ffe0ac','#d97300'],['#f25bd0','#ffc6f3','#b62fa0']];
const SHOEC=['#ff4f9a','#ffd23f','#ffffff','#8a4bff','#3aa0ff','#e23a5e','#2fcfa0','#3b2a5a'];
const PETS=['🐱','🐰','🦄','🐶','🦋','🕊️','🦊','🐼'];
const GOLD='#ffc83d',GOLDD='#e09a1f';
/* ---------- vẽ ---------- */
const star=(cx,cy,R,r,f,ex='')=>{let p='';for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?r:R;p+=(i?'L':'M')+(cx+Math.cos(a)*q).toFixed(1)+' '+(cy+Math.sin(a)*q).toFixed(1)}return `<path d="${p}Z" fill="${f}" ${ex}/>`};
const heart=(cx,cy,s,f,ex='')=>`<path d="M${cx} ${cy+s*.9}C${cx-s*1.6} ${cy-s*.2} ${cx-s*.7} ${cy-s*1.2} ${cx} ${cy-s*.35}C${cx+s*.7} ${cy-s*1.2} ${cx+s*1.6} ${cy-s*.2} ${cx} ${cy+s*.9}Z" fill="${f}" ${ex}/>`;
const flower=(cx,cy,r,f,c='#ffe066')=>{let s='';for(let i=0;i<5;i++){const a=i*1.2566-1.57;s+=`<circle cx="${(cx+Math.cos(a)*r).toFixed(1)}" cy="${(cy+Math.sin(a)*r).toFixed(1)}" r="${r*.72}" fill="${f}"/>`}return s+`<circle cx="${cx}" cy="${cy}" r="${r*.55}" fill="${c}"/>`};
const mir=s=>s+`<g transform="translate(400,0) scale(-1,1)">${s}</g>`;
const gem=(cx,cy,r,f)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"/><circle cx="${cx-r*.3}" cy="${cy-r*.3}" r="${r*.35}" fill="#fff" opacity=".8"/>`;
let UID=0;
function bgSVG(i){
 const R=(f)=>`<rect x="-300" y="-400" width="1000" height="1200" fill="${f}"/>`,fl=(c)=>`<ellipse cx="200" cy="640" rx="520" ry="90" fill="${c}"/><ellipse cx="200" cy="612" rx="120" ry="16" fill="#000" opacity=".12"/>`;
 let s='';const u='b'+(UID++);
 if(i===0){s=`<defs><linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc6e6"/><stop offset="1" stop-color="#ffe9f6"/></linearGradient></defs>${R(`url(#${u})`)}`
  +`<path d="M90 560V200Q200 60 310 200V560Z" fill="#fff6d6"/><path d="M104 560V206Q200 84 296 206V560Z" fill="#bfe6ff"/><path d="M200 96V560M104 330H296" stroke="#fff6d6" stroke-width="10"/><circle cx="250" cy="250" r="26" fill="#fff" opacity=".8"/>`
  +mir(`<path d="M-140 -60H60Q80 200 20 380Q-10 470 -40 600H-140Z" fill="#ff7fb5"/><path d="M-140 -60H20Q30 200 -20 380Q-50 470 -70 600H-140Z" fill="#ff5c9f"/><rect x="2" y="366" width="34" height="14" rx="7" fill="${GOLD}"/>`)+fl('#f7b9d9')

 else if(i===1){s=`<defs><linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd6ff"/><stop offset="1" stop-color="#e6f8ff"/></linearGradient></defs>${R(`url(#${u})`)}<circle cx="330" cy="90" r="46" fill="#ffe066"/>`
  +[[-20,150,1],[250,200,.8],[80,80,.7]].map(c=>`<g transform="translate(${c[0]},${c[1]}) scale(${c[2]})" fill="#fff"><circle cx="0" cy="0" r="30"/><circle cx="36" cy="-12" r="38"/><circle cx="78" cy="2" r="28"/></g>`).join('')
  +`<ellipse cx="60" cy="600" rx="300" ry="130" fill="#9be07a"/><ellipse cx="380" cy="620" rx="320" ry="130" fill="#7fd162"/>`+fl('#6cc452')

  +Array.from({length:34},(_,k)=>star((k*97)%640-120,(k*61)%460-60,3+k%4,1.4+k%2,'#fff','opacity="'+(.5+(k%5)/10)+'"')).join('')

 else if(i===5){s=`<defs><linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0ff"/><stop offset="1" stop-color="#f4fbff"/></linearGradient></defs>${R(`url(#${u})`)}`
  +mir(`<g fill="#e6f4ff"><path d="M-80 600l60-180 60 180Z"/><path d="M-70 520l50-150 50 150Z"/><path d="M-60 440l40-120 40 120Z"/></g><g fill="#cfe6fa"><path d="M30 610l40-120 40 120Z"/><path d="M36 550l34-100 34 100Z"/></g>`)+fl('#ffffff')

 else if(i===6){s=`<defs><linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a1f8a"/><stop offset="1" stop-color="#c2468f"/></linearGradient></defs>${R(`url(#${u})`)}<path d="M40 -100L-160 640H160Z" fill="#fff" opacity=".12"/><path d="M360 -100L240 640H560Z" fill="#fff" opacity=".12"/><path d="M200 -100L60 640H340Z" fill="#fff" opacity=".1"/>`

/* ---------- trạng thái ---------- */
const DEF={skin:0,hair:0,hairC:1,bang:0,eye:0,shadow:-1,lash:0,lip:0,lipC:0,blush:-1,sticker:-1,dress:0,dressC:0,crown:-1,ear:-1,neck:-1,back:-1,hand:-1,shoe:0,bg:0,pet:-1,glass:-1};
let st=Object.assign({},DEF),cat=0,zoom=false,album=[];
try{const s=JSON.parse(localStorage.getItem('pc_state'));if(s)st=Object.assign({},DEF,s);album=JSON.parse(localStorage.getItem('pc_album'))||[]}catch(e){}
const save=()=>{try{localStorage.setItem('pc_state',JSON.stringify(st));localStorage.setItem('pc_album',JSON.stringify(album))}catch(e){}};
const FACE='96 92 208 196',HEAD='70 30 260 290',BODY='60 270 280 350',ALL='-10 20 420 610';
const CATS=[
 {ic:'👗',n:'Váy',k:'dress',n0:8,vb:BODY,ck:'dressC',cl:DRC.map(c=>c[0]),tool:'👗',z:0},
 {ic:'💇‍♀️',n:'Tóc',k:'hair',n0:8,vb:'30 30 340 440',ck:'hairC',cl:HAIRC.map(c=>c[0]==='rainbow'?'conic-gradient(#ff6b9d,#ffa94d,#ffe066,#69db7c,#4dabf7,#b197fc,#ff6b9d)':c[0]),tool:'✂️',z:0},
 {ic:'🎀',n:'Mái',k:'bang',n0:4,vb:HEAD,tool:'✂️',z:1},
 {ic:'👁️',n:'Mắt',k:'lash',n0:4,vb:FACE,ck:'eye',cl:EYEC,tool:'🖌️',z:1},
 {ic:'🎨',n:'Phấn mắt',k:'shadow',n0:8,none:1,vb:FACE,tool:'🖌️',z:1},
 {ic:'💄',n:'Son',k:'lip',n0:4,vb:'150 215 100 70',ck:'lipC',cl:LIPC,tool:'💄',z:1},
 {ic:'🌸',n:'Má hồng',k:'blush',n0:5,none:1,vb:FACE,tool:'🖌️',z:1},
 {ic:'✨',n:'Hình dán',k:'sticker',n0:7,none:1,vb:FACE,tool:'✨',z:1},
 {ic:'👑',n:'Vương miện',k:'crown',n0:10,none:1,vb:'70 20 260 260',tool:'👑',z:1},
 {ic:'💎',n:'Bông tai',k:'ear',n0:7,none:1,vb:'70 150 120 120',tool:'💎',z:1},
 {ic:'📿',n:'Vòng cổ',k:'neck',n0:7,none:1,vb:'140 240 120 110',tool:'📿',z:0},
 {ic:'🕶️',n:'Kính',k:'glass',n0:3,none:1,vb:FACE,tool:'🕶️',z:1},
 {ic:'🦋',n:'Cánh',k:'back',n0:6,none:1,vb:'-10 180 420 440',tool:'🦋',z:0},
 {ic:'🪄',n:'Cầm tay',k:'hand',n0:7,none:1,vb:'90 220 250 240',tool:'🪄',z:0},
 {ic:'👠',n:'Giày',k:'shoe',n0:8,vb:'140 560 120 70',tool:'👠',z:0},
 {ic:'🐱',n:'Thú cưng',k:'pet',n0:8,none:1,emo:PETS,tool:'💖',z:0},
 {ic:'🧴',n:'Màu da',k:'skin',n0:6,vb:HEAD,tool:'🧴',z:1},
 {ic:'🏰',n:'Phông nền',k:'bg',n0:8,vb:'-100 0 600 640',bg:1,tool:'🏰',z:0}
];
/* ---------- âm thanh ---------- */
let AC,musicOn=false,mT=null,mI=0;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',v=.15,dl=0){const c=ac();if(!c)return;const t=c.currentTime+dl,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}
const sfx={tap(){tone(880,.08,'triangle',.14)},sparkle(){[1319,1568,2093,2637].forEach((f,i)=>tone(f,.18,'sine',.1,i*.06))},shot(){tone(1800,.04,'square',.1);tone(900,.1,'square',.08,.06)},win(){[523,659,784,1047,1319,1568,2093].forEach((f,i)=>tone(f,.25,'triangle',.16,i*.1))}};
const MEL=[659,784,880,784,659,523,587,659,0,784,880,988,880,784,659,587,523,0,587,659,784,659,587,523,440,523,0,659,587,523,587,0];
function music(){if(!musicOn)return;const f=MEL[mI++%MEL.length];if(f){tone(f,.5,'sine',.045);tone(f/2,.6,'triangle',.03)}mT=setTimeout(music,330)}
/* ---------- giao diện ---------- */
let curVB=[0,0,400,640],vbAnim=0;
function targetVB(){const s=$('#stage'),a=s.clientWidth/s.clientHeight;
 if(zoom){let W,H;if(a>=250/250){H=250;W=H*a}else{W=250;H=W/a}return [200-W/2,196-H/2,W,H]}
 if(640*a>=440){const W=640*a;return [200-W/2,0,W,640]}const W=440,H=W/a;return [200-W/2,648-H,W,H]}
function setVB(now){const t=targetVB(),m=$('#main');cancelAnimationFrame(vbAnim);if(now){curVB=t;m.setAttribute('viewBox',t.join(' '));return}
 const f=curVB.slice(),t0=performance.now();(function step(n){const p=Math.min(1,(n-t0)/420),e=1-Math.pow(1-p,3);curVB=f.map((v,i)=>v+(t[i]-v)*e);m.setAttribute('viewBox',curVB.join(' '));if(p<1)vbAnim=requestAnimationFrame(step)})(t0)}
window.setVB=setVB;
function render(){$('#main').innerHTML=draw(st,{main:1})}
function sparkles(n=10){const s=$('#stage');for(let i=0;i<n;i++){const d=document.createElement('span');d.className='spk';d.textContent=['✨','💖','⭐','🌟','💫'][rnd(5)];d.style.left=(18+Math.random()*64)+'%';d.style.top=(15+Math.random()*65)+'%';d.style.animationDelay=(Math.random()*.35)+'s';s.appendChild(d);setTimeout(()=>d.remove(),1400)}}
function applyFx(tool){const s=$('#stage'),d=document.createElement('span');d.className='tool';d.textContent=tool;d.style.left='50%';d.style.top=zoom?'50%':'45%';s.appendChild(d);setTimeout(()=>d.remove(),800);
 setTimeout(()=>{render();sparkles(8);sfx.sparkle();s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')},380)}
function tabs(){$('#tabs').innerHTML=CATS.map((c,i)=>`<button class="tab${i===cat?' on':''}" data-i="${i}">${c.ic}<small>${c.n}</small></button>`).join('');
 $$('#tabs .tab').forEach(b=>b.onclick=()=>{ac();sfx.tap();cat=+b.dataset.i;const z=!!CATS[cat].z;if(z!==zoom){zoom=z;setVB();$('#bZoom').textContent=zoom?'🔍 Xa':'🔍 Gần'}tabs();panel();b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})})}
function panel(){const c=CATS[cat];
 $('#cols').innerHTML=c.ck?c.cl.map((x,i)=>`<button class="sw${st[c.ck]===i?' on':''}" data-i="${i}" style="background:${x}"></button>`).join(''):'';
 $('#cols').style.display=c.ck?'flex':'none';
 let h=c.none?`<button class="op${st[c.k]===-1?' on':''}" data-i="-1">🚫</button>`:'';
 for(let i=0;i<c.n0;i++){const on=st[c.k]===i?' on':'';
  if(c.emo)h+=`<button class="op${on}" data-i="${i}">${c.emo[i]}</button>`;
  else{const t=Object.assign({},st);t[c.k]=i;h+=`<button class="op${on}" data-i="${i}"><svg viewBox="${c.vb}" preserveAspectRatio="xMidYMid ${c.bg?'slice':'meet'}">${c.bg?bgSVG(i):draw(t,{nobg:1})}</svg></button>`}}
 $('#opts').innerHTML=h;
 $$('#opts .op').forEach(b=>b.onclick=()=>{ac();st[c.k]=+b.dataset.i;save();$$('#opts .op').forEach(x=>x.classList.toggle('on',x===b));if(c.bg){render();sparkles(6);sfx.sparkle()}else applyFx(c.tool)});
 $$('#cols .sw').forEach(b=>b.onclick=()=>{ac();st[c.ck]=+b.dataset.i;save();applyFx(c.tool);setTimeout(panel,400)});
 const on=$('#opts .op.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})}
function randomize(){CATS.forEach(c=>{st[c.k]=c.none&&Math.random()<.3?-1:rnd(c.n0);if(c.ck)st[c.ck]=rnd(c.cl.length)});st.skin=rnd(SKIN.length);if(st.glass>=0&&Math.random()<.6)st.glass=-1;save();render();panel();sparkles(14);sfx.sparkle()}
function score(){let n=0;['crown','ear','neck','back','hand','pet','shadow','blush','sticker'].forEach(k=>{if(st[k]>=0)n++});return Math.min(5,2+Math.ceil(n/3))}
function show(){const s=$('#stage');if(s.classList.contains('show'))return;const was=zoom;zoom=false;setVB();const n=score();
 $('#banner').innerHTML=['','','Xinh quá!','Đáng yêu quá!','Lộng lẫy quá!','Công chúa tuyệt đẹp!'][n]+`<small>${'💖'.repeat(n)}${'🤍'.repeat(5-n)}</small>`;
 s.classList.add('show');sfx.win();
 for(let i=0;i<34;i++){const d=document.createElement('span');d.className='fall';d.textContent=['💖','⭐','🌸','✨','🎀','💎'][rnd(6)];d.style.left=Math.random()*96+'%';d.style.fontSize=(16+rnd(18))+'px';d.style.animationDuration=(2+Math.random()*2.2)+'s';d.style.animationDelay=Math.random()*1.6+'s';s.appendChild(d);setTimeout(()=>d.remove(),6000)}
 setTimeout(()=>{s.classList.remove('show');if(was){zoom=true;setVB()}},3800)}
