<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffd84a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học Chữ">
<title>Bé Vui Học Chữ</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;font-family:'Baloo 2','Nunito',system-ui,sans-serif;background:#3a2c20;color:#4b3566;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;padding:0}
#app{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#fff3c2 0%,#ffe3f0 52%,#d4efff 100%)}
@media(min-width:520px){#app{height:min(100dvh - 30px,880px);border-radius:38px;box-shadow:0 0 0 10px #241a12,0 30px 80px #0008}}
#gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#bg span{position:absolute;opacity:.5;animation:drift linear infinite}
.has3d #bg{display:none}
@keyframes drift{from{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(12deg)}to{transform:translateY(0) rotate(0)}}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex;animation:scin .45s cubic-bezier(.2,1.1,.4,1)}
@keyframes scin{from{opacity:0;transform:perspective(900px) rotateY(-22deg) translateX(36px) scale(.95)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.shake{animation:shake .4s}.pulse{animation:pulse .5s}
/* khối mộc dùng chung: màu phẳng, cạnh dày, đường chỉ khâu */
.b3d{position:relative;--c:#fffaf0;--cd:#f0d39a;background:var(--c);box-shadow:0 6px 0 var(--cd),0 11px 0 rgba(74,55,40,.1);transition:transform .1s,box-shadow .1s}
.b3d:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cd)}
.b3d::before{content:"";position:absolute;inset:5px;border-radius:inherit;border:2px dashed rgba(255,255,255,.55);pointer-events:none}
.k1{--c:#ff6fa3;--cd:#d9437b}.k2{--c:#9b6bff;--cd:#6f43d6}.k3{--c:#ff9f1c;--cd:#d97300}.k4{--c:#34c98a;--cd:#1f9c66}
.k5{--c:#2fa4ff;--cd:#1679cf}.k6{--c:#ffcf1f;--cd:#d9a800}.k7{--c:#ff6b5b;--cd:#d63b3b}.k8{--c:#13c7c0;--cd:#0a9893}.k9{--c:#f25bd0;--cd:#c234a3}.k10{--c:#8ccf2e;--cd:#64a313}
.ex{text-shadow:0 2px 0 rgba(74,55,40,.22)}
/* HOME */
#home{overflow-y:auto;padding:18px 16px 30px}
.hero{text-align:center;position:relative}
#mascot{height:clamp(140px,26vh,210px);font-size:clamp(3.6rem,15vw,5rem);display:grid;place-items:center;cursor:pointer}
.has3d #mascot,.has3d #bunny,.has3d #wbunny{color:transparent;font-size:0}
.logo{font-size:clamp(2rem,9.6vw,2.8rem);font-weight:800;line-height:1;margin:0 0 4px;letter-spacing:1px}
.logo b{display:inline-block;animation:hop 2.2s ease-in-out infinite;text-shadow:2px 0 0 #fffaf0,-2px 0 0 #fffaf0,0 2px 0 #fffaf0,0 -2px 0 #fffaf0,2px 2px 0 #fffaf0,-2px 2px 0 #fffaf0,2px -2px 0 #fffaf0,-2px -2px 0 #fffaf0,0 6px 0 rgba(74,55,40,.22)}
@keyframes hop{0%,60%,100%{transform:translateY(0) rotate(var(--r,0deg))}30%{transform:translateY(-8px) rotate(-5deg)}}
.sub{font-weight:700;opacity:.85;margin:6px 0 8px}
.chip{position:absolute;right:0;top:0;border-radius:99px;padding:4px 14px;font-weight:800;font-size:1.05rem;z-index:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;margin-top:12px;perspective:900px}
.card{border-radius:22px;padding:12px 12px 10px;text-align:left;color:#fff;min-height:clamp(96px,14.5vh,122px);display:flex;flex-direction:column;justify-content:flex-end;animation:cardin .55s cubic-bezier(.2,1.3,.4,1) backwards;transition:transform .18s,box-shadow .18s}
.card:nth-child(odd){rotate:-1.2deg}.card:nth-child(even){rotate:1deg}
.card:active{transform:none}
@keyframes cardin{from{opacity:0;transform:rotateX(-60deg) translateY(36px) scale(.85)}}
.card .ic{position:absolute;right:8px;top:-12px;font-size:clamp(2.3rem,10.5vw,3rem);width:1.5em;height:1.5em;display:grid;place-items:center;background:#fffaf0;border-radius:50%;box-shadow:0 4px 0 rgba(74,55,40,.2);animation:bob 3s ease-in-out infinite}
.card .ic i{font-style:normal;font-size:.62em;line-height:1}
.card h3{margin:0;font-size:1.2rem;line-height:1.05;text-shadow:0 2px 0 rgba(74,55,40,.2)}
.card p{margin:2px 0 0;font-size:.78rem;font-weight:600;opacity:.95;line-height:1.1}
.card.wide{grid-column:span 2;min-height:clamp(78px,10.5vh,92px);rotate:0deg}
.card.k6{color:#5a3d00}.card.k6 h3{text-shadow:none}.card.k6::before{border-color:rgba(90,61,0,.3)}
/* GAME */
.top{display:flex;align-items:center;gap:10px;padding:12px 14px 4px;position:relative}
.rbtn{width:46px;height:46px;border-radius:50%;font-size:1.3rem;flex:none;display:grid;place-items:center}
.rbtn::before,.chip::before,.starchip::before,.bubble::before,.strip button::before{border-color:rgba(74,55,40,.14)}
.prog{flex:1;height:18px;background:#fffaf0;border-radius:99px;overflow:hidden;box-shadow:inset 0 3px 0 rgba(74,55,40,.14);border:2px solid #f0d39a}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#ff9f1c 0 10px,#ffcf1f 10px 20px);border-radius:99px;transition:width .5s cubic-bezier(.3,1.6,.5,1)}
.starchip{border-radius:99px;padding:4px 12px;font-weight:800;flex:none}
.helper{display:flex;align-items:center;gap:8px;padding:4px 14px}
#bunny{width:96px;height:110px;font-size:2.6rem;display:grid;place-items:center;flex:none}
.bubble{flex:1;border-radius:18px;padding:8px 14px;font-weight:800;font-size:1.02rem;line-height:1.15}
.bubble::after{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#fffaf0;border-left:0}
#stage{flex:1;min-height:0;position:relative;padding:8px 14px 20px;display:flex;flex-direction:column}
.paper{background:#fffaf0;border-radius:24px;box-shadow:0 6px 0 #f0d39a,0 11px 0 rgba(74,55,40,.08);outline:2px dashed #f0d39a;outline-offset:-8px}
/* learn */
.lcard{flex:1;min-height:0;border-radius:26px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:30px 10px 10px;text-align:center;position:relative;box-shadow:0 7px 0 hsl(var(--h) 70% 48%),0 12px 0 rgba(74,55,40,.1);background:hsl(var(--h) 88% 64%);outline:2px dashed rgba(255,255,255,.6);outline-offset:-8px}
.lcard.inr{animation:inr .5s cubic-bezier(.2,1.3,.4,1)}.lcard.inl{animation:inl .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes inr{from{transform:perspective(800px) rotateY(55deg) translateX(90px);opacity:0}}
@keyframes inl{from{transform:perspective(800px) rotateY(-55deg) translateX(-90px);opacity:0}}
.ltag{position:absolute;left:16px;top:14px;background:#fffaf0;color:#4b3566;border-radius:6px;padding:1px 12px;font-weight:700;font-size:.85rem;z-index:1;rotate:-3deg}
.cubewrap{--cs:clamp(104px,18vh,156px);width:var(--cs);height:var(--cs);perspective:700px;cursor:pointer}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:rock 5s ease-in-out infinite}
.cube.spin{animation:cspin .9s cubic-bezier(.3,.9,.4,1)}
@keyframes rock{0%,100%{transform:rotateX(-14deg) rotateY(-30deg)}50%{transform:rotateX(-14deg) rotateY(30deg)}}
@keyframes cspin{from{transform:rotateX(-14deg) rotateY(-30deg)}to{transform:rotateX(-14deg) rotateY(330deg)}}
.face{position:absolute;inset:0;border-radius:8%;display:grid;place-items:center;font-size:calc(var(--cs)*.66);line-height:1;font-weight:800;color:hsl(var(--h) 78% 46%);background:repeating-linear-gradient(93deg,rgba(138,90,60,.11) 0 2px,transparent 2px 9px),#ecd3a6;box-shadow:inset 0 0 0 calc(var(--cs)*.05) #d6b683}
.face.s{background:repeating-linear-gradient(88deg,rgba(138,90,60,.11) 0 2px,transparent 2px 8px),#e2c592;color:hsl(calc(var(--h) + 50) 78% 46%)}
.face.t{background:repeating-linear-gradient(0deg,rgba(138,90,60,.1) 0 2px,transparent 2px 9px),#f3deb6;font-size:calc(var(--cs)*.5)}
.f1{transform:translateZ(calc(var(--cs)/2))}.f2{transform:rotateY(90deg) translateZ(calc(var(--cs)/2))}
.f3{transform:rotateY(180deg) translateZ(calc(var(--cs)/2))}.f4{transform:rotateY(-90deg) translateZ(calc(var(--cs)/2))}
.f5{transform:rotateX(90deg) translateZ(calc(var(--cs)/2))}.f6{transform:rotateX(-90deg) translateZ(calc(var(--cs)/2))}
.lemoji{font-size:clamp(3rem,9vh,4.8rem);line-height:1;z-index:1;animation:bob 2.4s ease-in-out infinite;cursor:pointer}
.lword{font-size:clamp(1.7rem,8vw,2.4rem);font-weight:800;z-index:1}
.lword b{background:#fffaf0;color:hsl(var(--h) 78% 46%);border-radius:8px;padding:0 10px;margin-right:2px;text-shadow:none;display:inline-block;box-shadow:0 4px 0 rgba(74,55,40,.18);rotate:-3deg}
.lnav{display:flex;gap:12px;align-items:center;justify-content:center;margin:18px 0 12px}
.nbtn{width:58px;height:58px;border-radius:50%;font-size:1.6rem;display:grid;place-items:center}
.nbtn.big{width:auto;padding:0 28px;border-radius:99px;color:#fff;font-weight:800;font-size:1.3rem;gap:8px;display:flex;align-items:center}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:42px;height:42px;border-radius:10px;background:#fffaf0;font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 #f0d39a}
.strip button.on{background:#9b6bff;color:#fff;transform:scale(1.15);box-shadow:0 4px 0 #6f43d6}
/* choice */
.qbig{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-bottom:18px;background:#fffaf0;border-radius:24px;box-shadow:0 6px 0 #f0d39a,0 11px 0 rgba(74,55,40,.08);outline:2px dashed #f0d39a;outline-offset:-8px}
.spkbig{width:clamp(110px,18vh,150px);height:clamp(110px,18vh,150px);border-radius:50%;font-size:clamp(3.4rem,10vh,4.6rem);background:#9b6bff;box-shadow:0 8px 0 #6f43d6,0 0 0 0 #9b6bff88;animation:ring 1.8s infinite}
@keyframes ring{70%{box-shadow:0 8px 0 #6f43d6,0 0 0 24px #9b6bff00}100%{box-shadow:0 8px 0 #6f43d6,0 0 0 0 #9b6bff00}}
.qemoji{font-size:clamp(4.6rem,13vh,7rem);line-height:1;animation:bob 2.4s ease-in-out infinite;cursor:pointer}
.qword{font-size:clamp(2rem,9vw,2.7rem);font-weight:800}
.qword .blank{display:inline-block;min-width:1.2em;background:#f3e6cc;border-radius:10px;color:#ff6b5b;box-shadow:inset 0 3px 0 rgba(74,55,40,.15);animation:blink 1.2s infinite;text-align:center}
.qword .blank.ok{animation:pulse .5s;background:#34c98a;color:#fff}
@keyframes blink{50%{background:#f7dfa0}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;perspective:800px}
.opt{height:clamp(74px,12.5vh,104px);border-radius:18px;font-size:clamp(2.4rem,7.5vh,3.4rem);font-weight:800;color:#fff;animation:cardin .5s cubic-bezier(.2,1.3,.4,1) backwards}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
.opt.x{opacity:.35;pointer-events:none;box-shadow:none;transform:translateY(6px)}
.opt.good{--c:#34c98a;--cd:#1f9c66;animation:okspin .7s;pointer-events:none}
@keyframes okspin{0%{transform:perspective(600px) rotateY(0) scale(1)}50%{transform:perspective(600px) rotateY(180deg) scale(1.12)}100%{transform:perspective(600px) rotateY(360deg) scale(1)}}
/* spell */
.slots{display:flex;gap:10px;justify-content:center;margin:0 0 16px;min-height:76px}
.slot{min-width:64px;height:74px;padding:0 6px;border-radius:12px;background:#fffaf0;border:3px dashed #ff9fc4;display:grid;place-items:center;font-size:2.4rem;font-weight:800;color:#4b3566}
.slot.filled{border:3px solid #1f9c66;background:#d8fbe9;color:#3f7a57;animation:pulse .4s;box-shadow:0 5px 0 #1f9c66}
.bank{display:flex;flex-wrap:wrap;gap:16px 12px;justify-content:center;align-content:center;min-height:170px}
.tile{min-width:68px;height:76px;padding:0 8px;border-radius:14px;font-size:2.4rem;font-weight:800;color:#fff}
.tile.used{visibility:hidden}
.flyer{position:absolute;z-index:25;border-radius:14px;display:grid;place-items:center;font-size:2.4rem;font-weight:800;color:#fff;pointer-events:none;transition:transform .42s cubic-bezier(.4,-.3,.5,1.3);box-shadow:0 8px 0 rgba(74,55,40,.2)}
/* bóng bay giấy */
.sky{flex:1;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(#c8ecff,#eaf8ff);box-shadow:0 6px 0 #9fd6f5;outline:2px dashed #fffaf0;outline-offset:-8px}
.tbadge{position:absolute;left:50%;top:14px;transform:translateX(-50%) rotate(-2deg);z-index:5;background:#fffaf0;border-radius:10px;padding:2px 20px;text-align:center;box-shadow:0 5px 0 #f0d39a;font-weight:800;line-height:1.05;pointer-events:none}
.tbadge small{display:block;font-size:.8rem;opacity:.7}.tbadge b{font-size:2.4rem;color:#ff6b5b}
.bub{position:absolute;bottom:-150px;width:var(--s);height:calc(var(--s)*1.12);border-radius:50% 50% 50% 50%/46% 46% 54% 54%;animation:rise var(--d) linear forwards;z-index:2;background:hsl(var(--c) 90% 63%);box-shadow:inset -7px -9px 0 hsl(var(--c) 80% 52%);color:#fff;font-weight:800;font-size:calc(var(--s) * .52)}
.bub::before{content:"";position:absolute;left:50%;top:100%;margin:-2px 0 0 -7px;border:7px solid transparent;border-top:0;border-bottom:9px solid hsl(var(--c) 80% 52%)}
.bub::after{content:"";position:absolute;left:50%;top:calc(100% + 6px);width:2px;height:34px;margin-left:-1px;background:rgba(74,55,40,.45)}
.bub span{display:block;animation:sway 2.4s ease-in-out infinite;text-shadow:0 2px 0 rgba(74,55,40,.2)}
@keyframes rise{to{transform:translateY(calc(-1 * var(--h)))}}
@keyframes sway{50%{transform:translateX(5px) rotate(6deg)}0%,100%{transform:translateX(-5px) rotate(-6deg)}}
.bub.pop{animation:popb .25s forwards!important}.bub.bye{opacity:0;transition:opacity .35s;pointer-events:none}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
/* match */
.mcols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:4px 14px;align-content:center}
.mcol{display:flex;flex-direction:column;gap:18px;justify-content:center}
.mt{height:clamp(58px,10vh,82px);border-radius:16px;font-size:clamp(2.2rem,6.5vh,3rem);font-weight:800;color:#4b3566}
.mt::before{border-color:rgba(74,55,40,.14)}
.mt.sel{--c:#9b6bff;--cd:#6f43d6;color:#fff;transform:scale(1.08) rotate(-3deg)}
.mt.done{pointer-events:none;color:#fff;transform:translateY(5px);box-shadow:0 1px 0 var(--cd)}
.mt.sel::before,.mt.done::before{border-color:rgba(255,255,255,.55)}
/* memory */
.mem{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:14px 10px;perspective:900px;padding-bottom:6px}
.mc{position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.mc.up{transform:rotateY(180deg)}
.mc i{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;font-weight:800;line-height:1.05}
.mc .bk{background:repeating-linear-gradient(45deg,#9b6bff 0 12px,#8a5af0 12px 24px);box-shadow:0 6px 0 #6f43d6;font-size:2rem;outline:2px dashed #fffaf0aa;outline-offset:-7px}
.mc .ft{transform:rotateY(180deg);background:#fffaf0;box-shadow:0 6px 0 #f0d39a}
.mc .ft b{font-size:clamp(1.7rem,7.5vw,2.3rem)}.mc .ft .me{font-size:clamp(2rem,6vh,2.8rem)}.mc .ft small{font-size:.9rem}
.mc.ok .ft{background:#d8fbe9;box-shadow:0 6px 0 #1f9c66,0 0 0 3px #34c98a}
.mc.ok{animation:okj .6s}
@keyframes okj{50%{transform:rotateY(180deg) scale(1.1) translateY(-8px)}}
/* trace */
.tracebox{position:relative;width:min(100%,48vh);aspect-ratio:1;margin:4px auto 18px;background:#fffdf6;border-radius:22px;box-shadow:0 7px 0 #f0d39a,0 12px 0 rgba(74,55,40,.08);overflow:hidden}
.tracebox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.trow{display:flex;gap:12px;align-items:center;justify-content:center}
.pill{border-radius:99px;padding:10px 20px;font-weight:800;font-size:1.05rem}
.pill::before{border-color:rgba(74,55,40,.14)}
.tmeter{flex:1;max-width:180px;height:18px;border-radius:99px;background:#fffaf0;border:2px solid #f0d39a;overflow:hidden}
.tmeter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6fa3,#ffcf1f,#34c98a);transition:width .3s}
/* tô màu */
.colbox{flex:1;min-height:0;background:#fffdf6;border-radius:22px;box-shadow:0 7px 0 #f0d39a,0 12px 0 rgba(74,55,40,.08);padding:8px;display:flex}
.colbox svg{width:100%;height:100%;touch-action:manipulation}
.colbox .r{fill:#fffdf6;stroke:#4a3728;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;cursor:pointer;transition:fill .2s}
.colbox .r.f{filter:url(#cr)}
.colbox .lt{font:800 100px "Baloo 2",sans-serif}
.colbox .nr{pointer-events:none;fill:#4a3728;stroke:#4a3728;stroke-width:3;stroke-linecap:round}
.crays{display:flex;justify-content:space-between;gap:6px;margin:20px 2px 4px}
.cray{flex:1;aspect-ratio:1;max-width:42px;border-radius:50%;background:var(--c);box-shadow:0 4px 0 rgba(74,55,40,.25);border:3px solid #fffaf0;transition:transform .15s}
.cray.on{transform:translateY(-7px) scale(1.22);border-color:#4b3566}
/* cắt dán */
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;background:#fffaf0;border-radius:24px;box-shadow:0 6px 0 #f0d39a,0 11px 0 rgba(74,55,40,.08)}
.pslots{display:flex;gap:10px}
.pslot{width:var(--pw);height:88px;border:3px dashed #ff9fc4;border-radius:8px;display:grid;place-items:center;font-size:2.3rem;font-weight:800;color:#e3d3b3}
.pslot.filled{border:0;color:#fff;rotate:-2.5deg;box-shadow:0 3px 0 rgba(74,55,40,.25);animation:pulse .4s}
.pslot.filled:nth-child(even){rotate:2deg}
.cutarea{position:relative;height:128px;touch-action:none;border-radius:18px;background:repeating-linear-gradient(0deg,rgba(74,55,40,.07) 0 1px,transparent 1px 16px),repeating-linear-gradient(90deg,rgba(74,55,40,.07) 0 1px,transparent 1px 16px),#6fdcae;box-shadow:0 6px 0 #3fb985}
.piece{position:absolute;top:20px;height:88px;display:grid;place-items:center;font-size:2.3rem;font-weight:800;color:#fff;transition:left .3s cubic-bezier(.3,1.5,.5,1),transform .25s;pointer-events:none;z-index:1}
.piece.free{pointer-events:auto;touch-action:none;border-radius:8px;transform:rotate(var(--r));box-shadow:0 4px 0 rgba(74,55,40,.25);cursor:grab}
.piece.drag{z-index:26;transition:none;box-shadow:0 12px 0 rgba(74,55,40,.15)}
.cline{position:absolute;top:8px;height:112px;width:0;border-left:3px dashed #4a3728;margin-left:-1.5px;pointer-events:none;z-index:2}

   for(let k=1;k<n;k++){if(cuts[k]||Math.abs(px-lines[k].x)>26)continue;
    span[k][0]=Math.min(span[k][0],py);span[k][1]=Math.max(span[k][1],py);
    if(span[k][1]-span[k][0]>H*.4){cuts[k]=true;lines[k].remove();sfx.snip();boom(e.clientX,e.clientY,10,.6);layout();
     if(cuts.filter(Boolean).length===n-1)setTimeout(()=>{if(G===g0)paste()},450)}}});
  const up=()=>{down=false};ca.addEventListener('pointerup',up);ca.addEventListener('pointercancel',up);
  function paste(){
   phase=2;setHint('Kéo từng mảnh, dán vào đúng ô nhé!','Bé dán chữ vào đúng ô nhé');
   const slots=$$('.pslot'),filled=Array(n).fill(false);let placed=0;
   pieces.forEach(p=>{
    p.classList.add('free');p.style.setProperty('--r',(Math.random()*10-5).toFixed(1)+'deg');
    let sx=0,sy=0,dx=0,dy=0,on=false;
    p.addEventListener('pointerdown',e=>{ac();on=true;sx=e.clientX;sy=e.clientY;dx=dy=0;try{p.setPointerCapture(e.pointerId)}catch(_){}p.classList.add('drag');sfx.tap()});
    p.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;dy=e.clientY-sy;p.style.transform=`translate(${dx}px,${dy}px) scale(1.1)`});
    const end=()=>{
     if(!on)return;on=false;p.classList.remove('drag');
     const b=p.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
     const j=slots.findIndex(s=>{const r=s.getBoundingClientRect();return cx>r.left-16&&cx<r.right+16&&cy>r.top-20&&cy<r.bottom+20});
     if(j>=0&&!filled[j]&&w.u[j]===p.textContent){
      filled[j]=true;p.style.pointerEvents='none';const r=slots[j].getBoundingClientRect();
      p.style.transform=`translate(${dx+r.left+r.width/2-cx}px,${dy+r.top+r.height/2-cy}px) scale(1)`;
      setTimeout(()=>{if(G!==g0)return;const s=slots[j];s.classList.add('filled','ex');s.style.background=p.style.background;p.remove();sfx.stick();boomEl(s,12);placed++;
       if(placed===n)setTimeout(()=>{if(G!==g0)return;good($('#sheet'),false);say(w.w.toLowerCase());$('#qe').style.animation='pulse .6s 3';advance(2000)},300)},200);
     }else{if(j>=0&&!filled[j])bad(null);p.style.transform=''}
    };
    p.addEventListener('pointerup',end);p.addEventListener('pointercancel',end);
   });
  }
 };
 G.next();
}};

/* khung trò chơi chọn đáp án */
function choiceGame(mk){
 G.total=8;setProg();
 G.next=()=>{
  const q=mk();
  stage().innerHTML=`<div class="qbig" id="qb">${q.big}</div><div class="opts">${q.options.map((o,i)=>`<button class="opt b3d ex k${i+1}" data-v="${o}">${o}</button>`).join('')}</div>`;
  setHint(q.prompt,q.speak);
  if(q.bind)q.bind($('#qb'));
  let locked=false;
  $$('.opt').forEach(b=>b.onclick=()=>{
   if(locked)return;ac();
   if(b.dataset.v===q.answer){locked=true;b.classList.add('good');if(q.reveal)q.reveal();good(b,!q.say);if(q.say)setTimeout(()=>say(q.say),300);advance(1600)}
   else{bad(b);b.classList.add('x')}
  });
 };
 G.next();
}

/* 3. Chữ đầu tiên */
GAMES.first={start(){

 choiceGame(()=>{

/* 4. Ghép chữ — khối chữ bay vào ô */
function fly(from,to,text,bg,cb){const a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),r=app.getBoundingClientRect(),c=document.createElement('div');
 c.className='flyer ex';c.textContent=text;c.style.cssText=`left:${a.left-r.left}px;top:${a.top-r.top}px;width:${a.width}px;height:${a.height}px;background:${bg}`;app.appendChild(c);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transform=`translate(${b.left-a.left+(b.width-a.width)/2}px,${b.top-a.top+(b.height-a.height)/2}px) rotate(360deg) scale(.9)`}));
 setTimeout(()=>{c.remove();cb()},440)}
GAMES.spell={start(){
 const list=shuffle(WORDS).slice(0,6).sort((a,b)=>a.u.length-b.u.length);
 G.total=list.length;setProg();
 G.next=()=>{
  const w=list[G.done];
  const ex=shuffle(EXTRA.filter(x=>!w.u.includes(x))).slice(0,w.u.length<3?3:2);
  const tiles=shuffle([...w.u,...ex]);
  stage().innerHTML=`<div class="qbig" id="qb"><div class="qemoji" id="qe">${w.e}</div></div>
   <div class="slots" id="slots">${w.u.map(()=>'<div class="slot"></div>').join('')}</div>
   <div class="bank" id="bank">${tiles.map((t,i)=>`<button class="tile b3d ex" data-u="${t}" style="--c:${KC[i%6][0]};--cd:${KC[i%6][1]}">${t}</button>`).join('')}</div>`;
  setHint('Ghép các chữ thành từ nhé!',w.w.toLowerCase());
  $('#qe').onclick=()=>{sfx.pop();say(w.w.toLowerCase())};
  const slots=$$('.slot');let pos=0;
  $$('.tile').forEach(t=>t.onclick=()=>{
   if(pos>=w.u.length)return;ac();
   if(t.dataset.u===w.u[pos]){
    const s=slots[pos],me=pos;pos++;t.classList.add('used');sfx.whoosh();
    fly(t,s,t.dataset.u,getComputedStyle(t).getPropertyValue('--c'),()=>{
     if(!s.isConnected||!G)return;
     s.textContent=t.dataset.u;s.classList.add('filled');sfx.pop();boomEl(s,10);
     if(me===w.u.length-1)setTimeout(()=>{if(!s.isConnected||!G)return;good($('#qb'),false);say(w.w.toLowerCase());$('#qe').style.animation='pulse .6s 3';advance(1900)},250)});
   }else bad(t);
  });
 };
 G.next();
}};

/* 5. Bong bóng chữ */
GAMES.bubble={start(){
 G.total=8;setProg();
 stage().innerHTML=`<div class="sky" id="sky"><div class="tbadge"><small>Tìm chữ</small><b id="tl"></b></div></div>`;
 const sky=$('#sky');let target=null,over=false;
 const nextTarget=()=>{let t;do{t=rand(L)}while(t===target);target=t;$('#tl').textContent=t.u+' '+t.l;
  setHint(`Chạm vào chữ ${t.u}`,'Chữ '+t.s);
  sky.querySelectorAll('.bub').forEach(b=>{b.classList.add('bye');setTimeout(()=>b.remove(),400)});setTimeout(spawn,200)};
 function spawn(){
  if(over||!G||!sky.isConnected||sky.querySelectorAll('.bub').length>9)return;
  const hasT=!!sky.querySelector('.bub[data-u="'+target.u+'"]:not(.pop):not(.bye)');
  const isT=!hasT||Math.random()<.3;
  const x=isT?target:rand(L.filter(l=>l!==target));
  const up=Math.random()<.6,s=64+Math.random()*26;
  const b=document.createElement('button');b.className='bub';b.dataset.u=x.u;
  b.style.cssText=`left:${4+Math.random()*(78-s/6)}%;--s:${s}px;--d:${6.5+Math.random()*3}s;--c:${Math.floor(Math.random()*360)};--h:${sky.clientHeight+140}px`;
  b.innerHTML=`<span>${up?x.u:x.l}</span>`;
  b.addEventListener('animationend',e=>{if(e.animationName==='rise')b.remove()});
  b.addEventListener('pointerdown',e=>{
   e.preventDefault();ac();
   if(over||b.classList.contains('pop')||b.classList.contains('bye'))return;
   if(x.u===target.u){
    b.classList.add('pop');sfx.pop();boomEl(b,26,1.2);setTimeout(()=>b.remove(),260);
    G.done++;G.combo++;setProg();react(true,false);
    if(G.combo>=3){floatMid(`Liên tiếp x${G.combo} 🔥`);sfx.combo(G.combo);T3&&T3.party()}
    if(G.done>=G.total){over=true;sky.querySelectorAll('.bub').forEach(q=>q.remove());const g=G;setTimeout(()=>{if(G===g)finish()},600)}
    else{say(rand(CHEER));setTimeout(()=>{if(!over)nextTarget()},600)}
   }else bad(b);
  });
  sky.appendChild(b);
 }
 const iv=setInterval(spawn,800);G.cleanup=()=>{over=true;clearInterval(iv)};
 nextTarget();
}};

/* 6. Lật thẻ trí nhớ 3D */
GAMES.memory={start(){
 G.total=6;setProg();
 const set=shuffle(L).slice(0,6),cards=shuffle(set.flatMap(x=>[{x,t:0},{x,t:1}]));
 stage().innerHTML=`<div class="mem">${cards.map((c,i)=>`<div class="mc up" data-i="${i}"><i class="bk">⭐</i><i class="ft">${c.t?`<span class="me">${c.x.e}</span><small>${c.x.w}</small>`:`<b style="color:hsl(${Math.round(c.x.i*12.4)} 78% 44%)">${c.x.u} ${c.x.l}</b>`}</i></div>`).join('')}</div>`;
 setHint('Nhớ vị trí, rồi lật chữ và hình đi cùng nhau nhé!','Bé nhớ vị trí các thẻ nhé');
 let open=[],lock=true;const g=G;
 G.timer=setTimeout(()=>{if(G!==g)return;$$('.mc').forEach(e=>e.classList.remove('up'));sfx.whoosh();lock=false},3000);
 $$('.mc').forEach(el=>el.onclick=()=>{
  if(lock||el.classList.contains('up'))return;ac();
  const c=cards[+el.dataset.i];el.classList.add('up');sfx.pop();say(c.t?c.x.w:c.x.s);open.push([el,c]);
  if(open.length<2)return;
  const [[e1,c1],[e2,c2]]=open;open=[];lock=true;
  if(c1.x===c2.x)setTimeout(()=>{if(G!==g)return;[e1,e2].forEach(e=>e.classList.add('ok'));good(e2,false);G.done++;setProg();lock=false;if(G.done>=G.total)G.timer=setTimeout(()=>{if(G===g)finish()},1300)},500);
  else setTimeout(()=>{if(G!==g)return;G.mistakes+=.34;G.combo=0;sfx.no();T3&&T3.sad();[e1,e2].forEach(e=>e.classList.remove('up'));lock=false},1100);
 });
}};

/* 7. Nối chữ hoa – thường */
GAMES.match={start(){
 G.total=15;setProg();
 G.next=()=>{
  const set=shuffle(L).slice(0,5),lf=shuffle(set),rt=shuffle(set);
  stage().innerHTML=`<div class="mcols"><div class="mcol">${lf.map(x=>`<button class="mt b3d" data-k="L" data-u="${x.u}">${x.u}</button>`).join('')}</div><div class="mcol">${rt.map(x=>`<button class="mt b3d" data-k="R" data-u="${x.u}">${x.l}</button>`).join('')}</div></div>`;
  setHint('Nối chữ HOA với chữ thường giống nhau nhé!',null,true);
  let sel=null,got=0;
  $$('.mt').forEach(b=>b.onclick=()=>{
   ac();const x=L.find(l=>l.u===b.dataset.u);
   if(!sel||sel.dataset.k===b.dataset.k){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');sfx.tap();say(x.s);return}
   if(sel.dataset.u===b.dataset.u){
    const c=KC[got%5];[sel,b].forEach(e=>{e.classList.remove('sel');e.classList.add('done');e.style.setProperty('--c',c[0]);e.style.setProperty('--cd',c[1])});
    boomEl(sel,16);good(b,false);say(x.s);sel=null;got++;G.done++;setProg();
    if(got===5){clearTimeout(G.timer);const g=G;G.timer=setTimeout(()=>{if(G!==g)return;if(G.done>=G.total)finish();else G.next()},1100)}
   }else{const a=sel;sel.classList.remove('sel');sel=null;bad(b);a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),450)}

 };
 G.next();
}};

/* 8. Tô chữ */
GAMES.trace={start(){
 const list=shuffle(L).slice(0,5);G.total=5;setProg();
 G.next=async()=>{
  const g0=G,t=list[G.done],ch=Math.random()<.55?t.u:t.l;
  stage().innerHTML=`<div class="tracebox" id="tb"><canvas id="cg"></canvas><canvas id="cd"></canvas></div>
   <div class="trow"><button class="pill b3d" id="clr">🧽 Xóa</button><div class="tmeter"><i id="tm"></i></div><button class="pill b3d" id="hr">🔊</button></div>`;
  setHint(`Dùng ngón tay tô chữ ${ch}`,'Tô chữ '+t.s);
  $('#hr').onclick=()=>{ac();say('Chữ '+t.s)};
  try{await document.fonts.load('800 100px "Baloo 2"')}catch(e){}
  if(G!==g0||!$('#tb'))return;
  const cg=$('#cg'),cd=$('#cd'),dpr=Math.min(window.devicePixelRatio||1,2),S=Math.round($('#tb').clientWidth*dpr);
  if(!S)return;
  cg.width=cg.height=cd.width=cd.height=S;
  const g=cg.getContext('2d'),d=cd.getContext('2d'),fs=S*.82;
  function drawLetter(c,fill,stroke){
   c.font=`800 ${fs}px "Baloo 2",sans-serif`;c.textAlign='center';c.textBaseline='alphabetic';
   const m=c.measureText(ch),y=S/2+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;
   if(fill){c.fillStyle=fill;c.fillText(ch,S/2,y)}
   if(stroke){c.setLineDash([S*.03,S*.025]);c.lineWidth=S*.008+2;c.strokeStyle=stroke;c.strokeText(ch,S/2,y)}
  }
  drawLetter(g,'#f6ecd9','#ff9fc4');
  const mk=document.createElement('canvas');mk.width=mk.height=S;const mc=mk.getContext('2d');drawLetter(mc,'#000',null);
  const md=mc.getImageData(0,0,S,S).data,pts=[];
  for(let y=0;y<S;y+=4)for(let x=0;x<S;x+=4)if(md[(y*S+x)*4+3]>128)pts.push((y*S+x)*4+3);
  const url=mk.toDataURL();cd.style.webkitMaskImage=cd.style.maskImage=`url(${url})`;cd.style.webkitMaskSize=cd.style.maskSize='100% 100%';
  d.lineCap=d.lineJoin='round';d.lineWidth=S*.115;
  let drawing=false,lx=0,ly=0,hue=0,lastCheck=0,done=false,lastFx=0;
  const pos=e=>{const r=cd.getBoundingClientRect();return[(e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height]};
  function cover(){const dd=d.getImageData(0,0,S,S).data;let n=0;for(const p of pts)if(dd[p]>0)n++;const v=pts.length?n/pts.length:0;$('#tm').style.width=Math.min(100,v/.62*100)+'%';return v}
  function check(){if(done||G!==g0)return;if(cover()>=.62){done=true;drawing=false;good($('#tb'),false);say(t.s+'. '+t.w);advance(1700)}}
  cd.addEventListener('pointerdown',e=>{if(done)return;e.preventDefault();ac();try{cd.setPointerCapture(e.pointerId)}catch(_){}drawing=true;[lx,ly]=pos(e);d.strokeStyle=`hsl(${hue} 92% 58%)`;d.beginPath();d.moveTo(lx,ly);d.lineTo(lx+.1,ly);d.stroke()});
  cd.addEventListener('pointermove',e=>{if(!drawing||done)return;e.preventDefault();const[x,y]=pos(e);hue=(hue+4)%360;d.strokeStyle=`hsl(${hue} 92% 58%)`;d.beginPath();d.moveTo(lx,ly);d.lineTo(x,y);d.stroke();lx=x;ly=y;
   const now=performance.now();if(now-lastFx>110){lastFx=now;boom(e.clientX,e.clientY,3)}
   if(now-lastCheck>350){lastCheck=now;check()}});
  const up=()=>{if(!drawing)return;drawing=false;check()};
  cd.addEventListener('pointerup',up);cd.addEventListener('pointercancel',up);
  $('#clr').onclick=()=>{sfx.tap();d.clearRect(0,0,S,S);$('#tm').style.width='0'};
 };
 G.next();
}};
